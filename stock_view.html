<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在庫表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Meiryo','Yu Gothic',sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
.container{max-width:720px;margin:24px auto;padding:0 12px 40px}
h1{font-size:18px;font-weight:bold;color:#1a3a5c;border-bottom:2px solid #1a3a5c;padding-bottom:8px;margin-bottom:20px}

.login-box{max-width:360px;margin:80px auto;text-align:center}
.login-box h1{border:none;margin-bottom:20px}
.btn-google{padding:13px 24px;background:#1a3a5c;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:bold;cursor:pointer}
.btn-google:hover{background:#2c5282}
#auth-loading{text-align:center;padding:60px 0;color:#666;font-size:14px}
.login-name-bar{font-size:12px;color:#555;background:#eef3f8;padding:8px 12px;border-radius:6px;margin-bottom:14px}

/* ロック中バナー（依頼者のみ表示） */
.lock-banner{font-size:13px;color:#856404;background:#fff3cd;border:1px solid #ffc107;border-radius:6px;padding:10px 12px;margin-bottom:14px;text-align:center;display:none}
.lock-banner.show{display:block}

/* タブ */
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab-btn{flex:1;padding:10px;border:1px solid #1a3a5c;border-radius:6px;background:#fff;color:#1a3a5c;font-size:14px;font-weight:bold;cursor:pointer}
.tab-btn.active{background:#1a3a5c;color:#fff}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* カード */
.stock-card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.1);padding:14px 16px;margin-bottom:10px}
.stock-card .top-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stock-card .main{flex:1;min-width:0}
.stock-card .item-name{font-size:15px;font-weight:bold;color:#1a3a5c;margin-bottom:4px}
.stock-card .sub-line{font-size:12px;color:#666}
.stock-card .qty-box{flex-shrink:0;text-align:center;background:#eef3f8;border-radius:6px;padding:6px 14px}
.stock-card .qty-box.replenishable{cursor:pointer}
.stock-card .qty-num{font-size:20px;font-weight:bold;color:#1a3a5c;line-height:1}
.stock-card .qty-num.low{color:#c53030}
.stock-card .qty-label{font-size:10px;color:#888;margin-top:2px}

/* 補充シート（共通品・作業者/管理者のみ） */
.replenish-sheet{margin-top:10px;padding:12px;border:1px solid #d0d8e4;border-radius:6px;background:#f7f9fc}
.replenish-sheet .rs-current{font-size:12px;color:#666;margin-bottom:8px;text-align:center}
.replenish-sheet .rs-stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
.replenish-sheet .rs-stepper button{width:32px;height:32px;border-radius:50%;border:1px solid #ccc;background:#fff;font-size:16px;font-weight:bold;cursor:pointer}
.replenish-sheet .rs-stepper .rs-val{font-size:18px;font-weight:bold;min-width:36px;text-align:center}
.replenish-sheet .rs-btns{display:flex;gap:8px}
.btn-replenish-submit{flex:1;padding:9px;background:#1a3a5c;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:bold;cursor:pointer}
.btn-replenish-cancel{padding:9px 14px;background:#fff;border:1px solid #999;color:#555;border-radius:6px;font-size:13px;cursor:pointer}
.replenish-msg{font-size:12px;color:#c53030;margin-top:6px}

/* 発注状況表示 */
.order-status{margin-top:10px;padding:8px 10px;border-radius:6px;background:#f0fff4;border:1px solid #9ae6b4;font-size:12px;color:#276749;display:flex;justify-content:space-between;align-items:center;gap:8px}
.order-status.proxy{background:#fff3cd;border-color:#ffc107;color:#856404}
.order-status .tag{font-size:10px;font-weight:bold;padding:2px 6px;border-radius:10px;background:#856404;color:#fff;margin-left:4px}
.btn-cancel-order{font-size:11px;color:#c53030;background:none;border:1px solid #c53030;border-radius:4px;padding:3px 8px;cursor:pointer;flex-shrink:0}
.btn-cancel-order:hover{background:#fff5f5}

.btn-order{margin-top:10px;width:100%;padding:9px;border:1px dashed #3182ce;border-radius:6px;background:#fff;color:#3182ce;font-size:13px;font-weight:bold;cursor:pointer}
.btn-order:hover{background:#ebf8ff}

/* 発注フォーム（インライン展開） */
.order-form{margin-top:10px;padding:12px;border:1px solid #d0d8e4;border-radius:6px;background:#f7f9fc}
.mode-row{display:flex;gap:6px;margin-bottom:10px}
.mode-row label{flex:1;text-align:center;font-size:12px;font-weight:normal;color:#555;padding:8px 4px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer}
.mode-row input[type="radio"]{display:none}
.mode-row label.selected{border-color:#2c5282;background:#dbeafe;color:#1a3a5c;font-weight:bold}
.order-form .field-group{margin-bottom:10px}
.order-form label.field-label{display:block;font-size:11px;color:#777;margin-bottom:3px}
.order-form select,.order-form input[type="number"],.order-form input[type="date"]{
  width:100%;padding:7px 9px;border:1px solid #ccc;border-radius:4px;font-size:13px;font-family:inherit;background:#fff;
}
.order-form-btns{display:flex;gap:8px}
.btn-order-submit{flex:1;padding:9px;background:#1a3a5c;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:bold;cursor:pointer}
.btn-order-cancel{padding:9px 14px;background:#fff;border:1px solid #999;color:#555;border-radius:6px;font-size:13px;cursor:pointer}
.order-form-msg{font-size:12px;color:#c53030;margin-top:6px}

.empty-msg{text-align:center;color:#999;font-size:13px;padding:30px 0}
#load-error{text-align:center;color:#c53030;font-size:13px;padding:20px 0}
</style>
</head>
<body>
<div class="container">

<div id="auth-loading">読み込み中...</div>

<div id="auth-login" class="login-box" style="display:none">
  <h1>📦 在庫表</h1>
  <button class="btn-google" onclick="loginWithGoogle()">Googleでログイン</button>
  <div id="auth-msg" style="margin-top:14px;font-size:13px;color:#c53030"></div>
</div>

<div id="auth-denied" class="login-box" style="display:none">
  <h1>📦 在庫表</h1>
  <p style="font-size:14px;color:#c53030">このアカウントはまだ利用登録されていません。管理者に連絡してください。</p>
</div>

<div id="app-content" style="display:none">
  <h1>📦 在庫表</h1>
  <div class="login-name-bar">ログイン中：<span id="login-name-display"></span> さん</div>

  <div class="lock-banner" id="lock-banner">ただいま発注欄はロック中です</div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-btn-individual" onclick="switchTab('individual')">個人依頼品</button>
    <button class="tab-btn" id="tab-btn-common" onclick="switchTab('common')">共通品</button>
  </div>

  <div id="tab-panel-individual" class="tab-panel active">
    <div id="individual-list"></div>
  </div>
  <div id="tab-panel-common" class="tab-panel">
    <div id="common-list"></div>
  </div>

  <div id="load-error" style="display:none"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://tguqfgdodevwowydkrkq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OH2iHpq9DIukdzNMUR0lyw_sfVyATp6';
const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = { email: '', name: '', role: '' };
let stockItemsCache = [];   // stock_items 全件（個人依頼品は request_item_date_id を持つ）
let ordersCache = {};       // stock_item_id -> 有効な注文の配列
let dateInfoCache = {};     // request_item_date_id -> { delivery_date }

// 締切・解除ロック関連
let lockSettings = { start: null, end: null };
let isLocked = false;

function escapeHtml(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function switchTab(which){
  document.getElementById('tab-btn-individual').classList.toggle('active', which==='individual');
  document.getElementById('tab-btn-common').classList.toggle('active', which==='common');
  document.getElementById('tab-panel-individual').classList.toggle('active', which==='individual');
  document.getElementById('tab-panel-common').classList.toggle('active', which==='common');
}

// =============================================
// 締切・解除時刻の設定を読み込み、今の時刻と比較してロック中かどうかを判定する
// =============================================
async function loadLockSettings(){
  const { data, error } = await sbClient
    .from('business_settings')
    .select('lock_start_time, lock_end_time')
    .limit(1)
    .maybeSingle();

  if(error || !data){
    isLocked = false;
    return;
  }

  lockSettings.start = data.lock_start_time;
  lockSettings.end = data.lock_end_time;

  const now = new Date();
  const nowStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':00';

  isLocked = (nowStr >= lockSettings.start && nowStr < lockSettings.end);
}

function updateLockBanner(){
  const banner = document.getElementById('lock-banner');
  if(currentUser.role === '依頼者' && isLocked){
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

function orderModeLabel(order){
  if(order.mode === '○') return '○（今すぐ欲しい）';
  if(order.mode === '数量') return `数量 ${order.qty}`;
  if(order.mode === '日付') return `希望日 ${order.desired_date || ''}`;
  return order.mode;
}

function isOrderingBlocked(){
  return currentUser.role === '依頼者' && isLocked;
}

// =============================================
// 個人依頼品カード（納入日を表示。同じ品目でも納入日ごとに別カードになる）
// =============================================
function renderIndividualCard(row){
  const sizeText = [row.size_l, row.size_w, row.size_h].filter(v=>v!=null).join('×');
  const dateInfo = row.request_item_date_id ? dateInfoCache[row.request_item_date_id] : null;
  const dateText = dateInfo ? `納入日：${dateInfo.delivery_date}` : '';
  const activeOrders = ordersCache[row.id] || [];
  const order = activeOrders[0];

  const canOperate = currentUser.role === '依頼者' || currentUser.role === '管理者';
  const isSelfItem = currentUser.name && row.requester_name === currentUser.name;
  const blocked = isOrderingBlocked();
  const showOrderBtn = canOperate && !order && (isSelfItem || currentUser.role === '管理者') && !blocked;

  let statusHtml = '';
  if(order){
    const proxyTag = order.is_proxy ? '<span class="tag">代理</span>' : '';
    const canCancel = (order.operated_by_email === currentUser.email) || currentUser.role === '管理者';
    statusHtml = `
      <div class="order-status${order.is_proxy ? ' proxy' : ''}">
        <span>${escapeHtml(orderModeLabel(order))}　${escapeHtml(order.operated_by_name)}さん${proxyTag}</span>
        ${canCancel ? `<button class="btn-cancel-order" onclick="cancelOrder('${order.id}')">取消</button>` : ''}
      </div>`;
  }

  const orderBtnHtml = showOrderBtn
    ? `<button class="btn-order" onclick="openOrderForm('${row.id}', 'individual', this)">${isSelfItem ? '発注する' : '代理で発注する'}</button>`
    : '';

  return `
    <div class="stock-card" data-stock-item-id="${row.id}">
      <div class="top-row">
        <div class="main">
          <div class="item-name">${escapeHtml(row.item_name)}</div>
          <div class="sub-line">${escapeHtml(sizeText)}　依頼者：${escapeHtml(row.requester_name || '（不明）')}</div>
          ${dateText ? `<div class="sub-line">${escapeHtml(dateText)}</div>` : ''}
        </div>
        <div class="qty-box">
          <div class="qty-num">${row.stock_qty ?? 0}</div>
          <div class="qty-label">在庫</div>
        </div>
      </div>
      ${statusHtml}
      ${orderBtnHtml}
      <div class="order-form-slot"></div>
    </div>`;
}

// =============================================
// 共通品カード（変更なし）
// =============================================
function renderCommonCard(row){
  const activeOrders = ordersCache[row.id] || [];
  const order = activeOrders[0];
  const canOperate = currentUser.role === '依頼者' || currentUser.role === '管理者';
  const blocked = isOrderingBlocked();
  const canReplenish = currentUser.role === '作業者' || currentUser.role === '管理者';
  const isLow = (row.min_line ?? 0) > 0 && (row.stock_qty ?? 0) <= row.min_line;

  let statusHtml = '';
  if(order){
    const proxyTag = order.is_proxy ? '<span class="tag">代理</span>' : '';
    const destText = order.destination ? `（${escapeHtml(order.destination)}）` : '';
    const canCancel = (order.operated_by_email === currentUser.email) || currentUser.role === '管理者';
    statusHtml = `
      <div class="order-status${order.is_proxy ? ' proxy' : ''}">
        <span>${escapeHtml(orderModeLabel(order))}${destText}　${escapeHtml(order.operated_by_name)}さん${proxyTag}</span>
        ${canCancel ? `<button class="btn-cancel-order" onclick="cancelOrder('${order.id}')">取消</button>` : ''}
      </div>`;
  }

  const orderBtnHtml = (canOperate && !blocked)
    ? `<button class="btn-order" onclick="openOrderForm('${row.id}', 'common', this)">${order ? '追加で発注する' : '発注する'}</button>`
    : '';

  const qtyBoxAttrs = canReplenish ? `onclick="openReplenishForm('${row.id}', this)"` : '';

  return `
    <div class="stock-card" data-stock-item-id="${row.id}">
      <div class="top-row">
        <div class="main">
          <div class="item-name">${escapeHtml(row.item_name)}</div>
        </div>
        <div class="qty-box${canReplenish ? ' replenishable' : ''}" ${qtyBoxAttrs}>
          <div class="qty-num${isLow ? ' low' : ''}">${row.stock_qty ?? 0}</div>
          <div class="qty-label">在庫</div>
        </div>
      </div>
      ${statusHtml}
      ${orderBtnHtml}
      <div class="order-form-slot"></div>
      <div class="replenish-form-slot"></div>
    </div>`;
}

function openReplenishForm(stockItemId, boxEl){
  const card = boxEl.closest('.stock-card');
  const slot = card.querySelector('.replenish-form-slot');
  if(slot.innerHTML){ slot.innerHTML = ''; return; }

  const stockRow = stockItemsCache.find(r => r.id === stockItemId);
  const currentQty = stockRow ? (stockRow.stock_qty ?? 0) : 0;

  slot.innerHTML = `
    <div class="replenish-sheet">
      <div class="rs-current">現在の在庫 <b>${currentQty}</b>　↓ この数だけ追加します</div>
      <div class="rs-stepper">
        <button type="button" onclick="adjustReplenishQty('${stockItemId}', -1)">−</button>
        <div class="rs-val" id="replenish-qty-${stockItemId}">1</div>
        <button type="button" onclick="adjustReplenishQty('${stockItemId}', 1)">＋</button>
      </div>
      <div class="rs-btns">
        <button class="btn-replenish-submit" onclick="submitReplenish('${stockItemId}')">この数を補充する</button>
        <button class="btn-replenish-cancel" onclick="closeReplenishForm('${stockItemId}')">やめる</button>
      </div>
      <div class="replenish-msg" id="replenish-msg-${stockItemId}"></div>
    </div>`;
}

function closeReplenishForm(stockItemId){
  const input = document.getElementById(`replenish-qty-${stockItemId}`);
  if(!input) return;
  input.closest('.replenish-form-slot').innerHTML = '';
}

function adjustReplenishQty(stockItemId, delta){
  const el = document.getElementById(`replenish-qty-${stockItemId}`);
  if(!el) return;
  const next = Math.max(1, parseInt(el.textContent, 10) + delta);
  el.textContent = next;
}

async function submitReplenish(stockItemId){
  const qtyEl = document.getElementById(`replenish-qty-${stockItemId}`);
  const msgEl = document.getElementById(`replenish-msg-${stockItemId}`);
  const addQty = parseInt(qtyEl.textContent, 10);

  const stockRow = stockItemsCache.find(r => r.id === stockItemId);
  if(!stockRow){ msgEl.textContent = '在庫データが見つかりません。'; return; }

  const newQty = (stockRow.stock_qty ?? 0) + addQty;

  const { error } = await sbClient
    .from('stock_items')
    .update({ stock_qty: newQty })
    .eq('id', stockItemId);

  if(error){
    msgEl.textContent = '補充に失敗しました：' + error.message;
    return;
  }

  await loadStockItems();
}

function openOrderForm(stockItemId, itemType, btnEl){
  const card = btnEl.closest('.stock-card');
  const slot = card.querySelector('.order-form-slot');
  btnEl.style.display = 'none';

  const destFieldHtml = itemType === 'common' ? `
    <div class="field-group">
      <label class="field-label">配送先</label>
      <select id="order-dest-${stockItemId}">
        <option value="FA">FA</option>
        <option value="新工場">新工場</option>
      </select>
    </div>` : '';

  slot.innerHTML = `
    <div class="order-form">
      <div class="mode-row" id="order-mode-row-${stockItemId}">
        <label class="selected" id="mode-lbl-circle-${stockItemId}"><input type="radio" name="order-mode-${stockItemId}" value="○" checked onchange="onOrderModeChange('${stockItemId}')"> ○</label>
        <label id="mode-lbl-qty-${stockItemId}"><input type="radio" name="order-mode-${stockItemId}" value="数量" onchange="onOrderModeChange('${stockItemId}')"> 数量</label>
        <label id="mode-lbl-date-${stockItemId}"><input type="radio" name="order-mode-${stockItemId}" value="日付" onchange="onOrderModeChange('${stockItemId}')"> 日付</label>
      </div>
      <div class="field-group" id="order-qty-group-${stockItemId}" style="display:none">
        <label class="field-label">数量</label>
        <input type="number" id="order-qty-${stockItemId}" min="1">
      </div>
      <div class="field-group" id="order-date-group-${stockItemId}" style="display:none">
        <label class="field-label">希望日</label>
        <input type="date" id="order-date-${stockItemId}">
      </div>
      ${destFieldHtml}
      <div class="order-form-btns">
        <button class="btn-order-submit" onclick="submitOrder('${stockItemId}', '${itemType}')">この内容で発注する</button>
        <button class="btn-order-cancel" onclick="closeOrderForm('${stockItemId}', this)">やめる</button>
      </div>
      <div class="order-form-msg" id="order-form-msg-${stockItemId}"></div>
    </div>`;
}

function closeOrderForm(stockItemId, btnEl){
  const card = btnEl.closest('.stock-card');
  card.querySelector('.order-form-slot').innerHTML = '';
  const orderBtn = card.querySelector('.btn-order');
  if(orderBtn) orderBtn.style.display = '';
}

function onOrderModeChange(stockItemId){
  const mode = document.querySelector(`input[name="order-mode-${stockItemId}"]:checked`).value;
  ['circle','qty','date'].forEach(k=>{
    document.getElementById(`mode-lbl-${k}-${stockItemId}`).classList.remove('selected');
  });
  const map = {'○':'circle','数量':'qty','日付':'date'};
  document.getElementById(`mode-lbl-${map[mode]}-${stockItemId}`).classList.add('selected');
  document.getElementById(`order-qty-group-${stockItemId}`).style.display = (mode==='数量') ? '' : 'none';
  document.getElementById(`order-date-group-${stockItemId}`).style.display = (mode==='日付') ? '' : 'none';
}

async function submitOrder(stockItemId, itemType){
  if(isOrderingBlocked()){
    const msgEl = document.getElementById(`order-form-msg-${stockItemId}`);
    if(msgEl) msgEl.textContent = 'ただいま発注欄はロック中のため、発注できません。';
    return;
  }

  const mode = document.querySelector(`input[name="order-mode-${stockItemId}"]:checked`).value;
  const msgEl = document.getElementById(`order-form-msg-${stockItemId}`);
  msgEl.textContent = '';

  let qty = null, desiredDate = null;
  if(mode === '数量'){
    qty = parseInt(document.getElementById(`order-qty-${stockItemId}`).value, 10);
    if(!qty || qty < 1){ msgEl.textContent = '数量を入力してください。'; return; }
  }
  if(mode === '日付'){
    desiredDate = document.getElementById(`order-date-${stockItemId}`).value;
    if(!desiredDate){ msgEl.textContent = '希望日を入力してください。'; return; }
  }

  let destination = null;
  if(itemType === 'common'){
    destination = document.getElementById(`order-dest-${stockItemId}`).value;
  }

  const stockRow = stockItemsCache.find(r => r.id === stockItemId);
  const isSelfItem = itemType === 'individual' && stockRow && stockRow.requester_name === currentUser.name;
  const isProxy = itemType === 'individual' ? !isSelfItem : false;

  const existing = ordersCache[stockItemId] || [];
  if(itemType === 'common' && existing.length > 0){
    const other = existing[0];
    const who = other.is_proxy ? `管理者が代理で` : `${other.operated_by_name}さんが`;
    const ok = confirm(`既に${who}発注済みです。それでも発注しますか？`);
    if(!ok) return;
  }

  const payload = {
    stock_item_id: stockItemId,
    operated_by_email: currentUser.email,
    operated_by_name: currentUser.name,
    destination: destination,
    mode: mode,
    qty: qty,
    desired_date: desiredDate,
    is_proxy: isProxy,
    is_canceled: false
  };

  const { error } = await sbClient.from('stock_orders').insert(payload);
  if(error){
    msgEl.textContent = '発注に失敗しました：' + error.message;
    return;
  }

  await loadStockItems();
}

async function cancelOrder(orderId){
  if(!confirm('この発注を取消しますか？')) return;
  const { error } = await sbClient.from('stock_orders').update({ is_canceled: true }).eq('id', orderId);
  if(error){
    alert('取消に失敗しました：' + error.message);
    return;
  }
  await loadStockItems();
}

// =============================================
// データ読み込み・再描画
// =============================================
async function loadStockItems(){
  await loadLockSettings();
  updateLockBanner();

  const { data: items, error: itemsErr } = await sbClient
    .from('stock_items')
    .select('id, item_type, item_name, size_l, size_w, size_h, requester_name, stock_qty, min_line, request_item_date_id')
    .order('item_name', { ascending: true });

  if(itemsErr){
    document.getElementById('load-error').style.display = 'block';
    document.getElementById('load-error').textContent = '在庫データの取得に失敗しました：' + itemsErr.message;
    return;
  }
  document.getElementById('load-error').style.display = 'none';
  stockItemsCache = items || [];

  // 個人依頼品の納入日を取得
  const dateIds = stockItemsCache
    .filter(r => r.item_type === 'individual' && r.request_item_date_id)
    .map(r => r.request_item_date_id);

  dateInfoCache = {};
  if(dateIds.length){
    const { data: dateRows } = await sbClient
      .from('request_item_dates')
      .select('id, delivery_date')
      .in('id', dateIds);
    (dateRows || []).forEach(d => { dateInfoCache[d.id] = { delivery_date: d.delivery_date }; });
  }

  const { data: orders, error: ordersErr } = await sbClient
    .from('stock_orders')
    .select('id, stock_item_id, operated_by_email, operated_by_name, destination, mode, qty, desired_date, is_proxy')
    .eq('is_canceled', false)
    .order('created_at', { ascending: true });

  ordersCache = {};
  if(!ordersErr && orders){
    orders.forEach(o=>{
      if(!ordersCache[o.stock_item_id]) ordersCache[o.stock_item_id] = [];
      ordersCache[o.stock_item_id].push(o);
    });
  }

  const individualRows = stockItemsCache.filter(r => r.item_type === 'individual');
  const commonRows = stockItemsCache.filter(r => r.item_type === 'common');

  const indEl = document.getElementById('individual-list');
  const comEl = document.getElementById('common-list');

  indEl.innerHTML = individualRows.length
    ? individualRows.map(renderIndividualCard).join('')
    : '<div class="empty-msg">現在、個人依頼品はありません</div>';

  comEl.innerHTML = commonRows.length
    ? commonRows.map(renderCommonCard).join('')
    : '<div class="empty-msg">現在、共通品はありません</div>';
}

async function loginWithGoogle(){
  const { error } = await sbClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href }
  });
  if(error){
    document.getElementById('auth-msg').textContent = 'ログインに失敗しました：' + error.message;
  }
}

async function initAuth(){
  const { data: { user } } = await sbClient.auth.getUser();

  if(!user){
    document.getElementById('auth-loading').style.display='none';
    document.getElementById('auth-login').style.display='block';
    return;
  }

  const { data: allowRow, error: allowErr } = await sbClient
    .from('users_allowlist')
    .select('name, role')
    .eq('email', user.email)
    .maybeSingle();

  if(allowErr || !allowRow || !allowRow.name){
    document.getElementById('auth-loading').style.display='none';
    document.getElementById('auth-denied').style.display='block';
    return;
  }

  currentUser.email = user.email;
  currentUser.name = allowRow.name;
  currentUser.role = allowRow.role;

  document.getElementById('login-name-display').textContent = currentUser.name;
  document.getElementById('auth-loading').style.display='none';
  document.getElementById('app-content').style.display='block';

  await loadStockItems();
  subscribeRealtime();
}

let realtimeReloadPending = false;

function isAnyOrderFormOpen(){
  return document.querySelector('.order-form') !== null || document.querySelector('.replenish-sheet') !== null;
}

function requestStockReload(){
  if(isAnyOrderFormOpen()){
    realtimeReloadPending = true;
    return;
  }
  loadStockItems();
}

function subscribeRealtime(){
  sbClient
    .channel('stock_view_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'stock_items' }, (payload) => { console.log('[realtime] stock_items changed', payload); requestStockReload(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'stock_orders' }, (payload) => { console.log('[realtime] stock_orders changed', payload); requestStockReload(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'stock_deliveries' }, (payload) => { console.log('[realtime] stock_deliveries changed', payload); requestStockReload(); })
    .subscribe((status, err) => {
      console.log('[realtime] channel status:', status, err || '');
    });

  setInterval(() => {
    if(realtimeReloadPending && !isAnyOrderFormOpen()){
      realtimeReloadPending = false;
      loadStockItems();
    }
  }, 1500);
}

initAuth();
</script>
