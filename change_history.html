<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>変更履歴</title>
<style>
:root{
  --ink:#1B2430;
  --ink-soft:#6B7480;
  --ink-faint:#A2A8B3;
  --line:#E4E7EC;
  --bg-page:#EEF1F5;
  --white:#FFFFFF;
  --accent:#2A4B8D;
  --accent-deep:#1E3766;
  --accent-soft:#E6ECF7;
  --alert:#C4531F;
  --alert-soft:#FBEAE0;
  --amber:#B98418;
  --amber-soft:#FAF0DE;
  --ready:#2F7D4F;
  --ready-soft:#E4F3E8;
  --muted:#8B93A0;
  --muted-soft:#F0F1F3;
  --proxy:#5B3E96;
  --proxy-soft:#EDE7F6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system, "Hiragino Kaku Gothic ProN", "游ゴシック", YuGothic, sans-serif;background:var(--bg-page);color:var(--ink);min-height:100vh}
.container{max-width:960px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:18px;font-weight:800;color:var(--accent-deep);border-bottom:2px solid var(--accent-deep);padding-bottom:8px;margin-bottom:20px}
p.desc{font-size:12px;color:var(--ink-soft);margin-bottom:16px;line-height:1.6}

.login-box{max-width:360px;margin:80px auto;text-align:center}
.login-box h1{border:none;margin-bottom:20px}
.btn-google{padding:13px 24px;background:var(--accent);color:#fff;border:none;border-radius:999px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
.btn-google:hover{background:var(--accent-deep)}
#auth-loading{text-align:center;padding:60px 0;color:var(--ink-soft);font-size:14px}
.login-name-bar{font-size:12px;color:var(--ink-soft);background:var(--accent-soft);padding:8px 12px;border-radius:10px;margin-bottom:14px}

/* ================= ADMIN SHELL(home.htmlと共通の左メニュー方式) ================= */
.admin-shell{ width:100%; display:flex; min-height:100vh; align-items:stretch; }
.admin-sidebar{ width:80px; flex:0 0 auto; background:var(--accent-deep); display:flex; flex-direction:column; align-items:center; padding:20px 0 12px; }
.admin-sidebar .as-logo{ color:#fff; font-size:21px; margin-bottom:20px; }
.as-nav{ display:flex; flex-direction:column; gap:5px; width:100%; align-items:center; }
.as-item{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 3px; color:rgba(255,255,255,0.6); cursor:pointer; border-radius:11px; width:64px; text-decoration:none; }
.as-item svg{ width:18px; height:18px; }
.as-item .as-label{ font-size:8.3px; font-weight:700; text-align:center; line-height:1.25; }
.as-item:hover{ background:rgba(255,255,255,0.09); color:#fff; }
.as-item.active{ background:rgba(255,255,255,0.18); color:#fff; }
.admin-main{ flex:1 1 auto; min-width:0; background:var(--bg-page); }
@media (max-width:640px){
  .admin-sidebar{ width:60px; }
  .as-item{ width:48px; }
  .container{ padding:18px 12px 40px; }
}

/* ================= フィルタ ================= */
.filter-panel{ background:var(--white); border:1px solid var(--line); border-radius:14px; padding:14px 16px 16px; margin-bottom:16px; }
.filter-row{ display:grid; grid-template-columns:1fr 1fr 1.3fr; gap:12px; }
.filter-group{ display:flex; flex-direction:column; gap:5px; min-width:0; }
.filter-group label{ font-size:10.5px; font-weight:800; color:var(--ink-soft); }
.filter-group select, .filter-group input[type="text"], .filter-group input[type="date"]{
  appearance:none; border:1.4px solid var(--line); background:var(--white); border-radius:9px;
  padding:8px 10px; font-family:inherit; font-size:12.5px; color:var(--ink); width:100%;
}
.date-range{ display:flex; align-items:center; gap:6px; }
.date-range input{ flex:1; min-width:0; }
.date-range span{ color:var(--ink-faint); font-size:11px; flex-shrink:0; }

.chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.chip{
  appearance:none; cursor:pointer; border:1.4px solid var(--line); background:var(--white);
  border-radius:999px; padding:6px 13px; font-family:inherit; font-size:11.5px; font-weight:700; color:var(--ink-soft);
}
.chip.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-deep); }

.filter-footer{ display:flex; align-items:center; justify-content:space-between; margin-top:13px; flex-wrap:wrap; gap:8px; }
.result-count{ font-size:11.5px; color:var(--ink-soft); }
.result-count b{ color:var(--ink); }
.reset-btn{ appearance:none; border:none; background:none; cursor:pointer; font-family:inherit; font-size:11.5px; font-weight:700; color:var(--accent-deep); padding:4px 2px; }

/* ================= ログ一覧 ================= */
.day-group{ margin-bottom:20px; }
.day-heading{ display:flex; align-items:baseline; gap:8px; margin-bottom:8px; padding-left:2px; }
.day-heading .dh-date{ font-size:13px; font-weight:800; }
.day-heading .dh-dow{ font-size:11px; color:var(--ink-faint); font-weight:700; }
.day-heading .dh-count{ font-size:10.5px; color:var(--ink-faint); margin-left:auto; }

.log-table{ background:var(--white); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.log-row{ display:grid; grid-template-columns:52px 108px 88px 1fr; gap:10px; align-items:start; padding:10px 14px; border-top:1px solid var(--line); }
.log-row:first-child{ border-top:none; }
.log-row.flag{ background:var(--alert-soft); }

.lg-time{ font-size:11px; color:var(--ink-faint); padding-top:2px; }
.lg-actor{ display:flex; flex-direction:column; gap:2px; }
.lg-actor .a-name{ font-size:12px; font-weight:800; }
.lg-type{ padding-top:1px; }
.type-badge{ display:inline-block; font-size:10px; font-weight:800; padding:3px 9px; border-radius:999px; white-space:nowrap; }
.type-badge.cancel{ background:var(--alert-soft); color:var(--alert); }
.type-badge.order{ background:var(--accent-soft); color:var(--accent-deep); }
.type-badge.progress{ background:#FBE7EE; color:#B23B63; }
.type-badge.complete{ background:var(--amber-soft); color:var(--amber); }
.type-badge.delivery{ background:#E7EEF6; color:#3D5A80; }
.type-badge.other{ background:var(--muted-soft); color:var(--muted); }

.lg-detail{ min-width:0; }
.lg-detail .d-target{ font-size:12.5px; font-weight:700; display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
.lg-detail .d-action{ font-size:12px; color:var(--ink); margin-top:1px; }
.lg-detail .d-change{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
.lg-detail .d-change .arrow{ color:var(--ink-faint); margin:0 3px; }

.tag{ flex-shrink:0; font-size:8.5px; font-weight:800; padding:2px 7px; border-radius:999px; }
.tag.proxy{ background:var(--proxy-soft); color:var(--proxy); }
.tag.review{ background:var(--alert); color:#fff; }

.empty-state{ text-align:center; padding:34px 10px; color:var(--ink-faint); font-size:12px; background:var(--white); border:1px solid var(--line); border-radius:12px; }

.load-more{ display:flex; justify-content:center; margin-top:18px; }
.load-more button{
  appearance:none; cursor:pointer; border:1.4px solid var(--line); background:var(--white);
  border-radius:999px; padding:9px 22px; font-family:inherit; font-size:12px; font-weight:800; color:var(--ink-soft);
}
.load-more button:disabled{ opacity:.5; cursor:default; }
.load-more .lm-note{ display:block; text-align:center; font-size:10px; color:var(--ink-faint); margin-top:6px; }

#load-error{text-align:center;color:var(--alert);font-size:13px;padding:20px 0}

@media (max-width:640px){
  .filter-row{ grid-template-columns:1fr; }
  .log-row{ grid-template-columns:1fr; gap:4px; }
  .lg-time{ order:1; }
  .lg-actor{ order:2; flex-direction:row; align-items:baseline; gap:6px; }
  .lg-type{ order:3; }
  .lg-detail{ order:4; }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://tguqfgdodevwowydkrkq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OH2iHpq9DIukdzNMUR0lyw_sfVyATp6';
const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = { email: '', name: '', role: '' };

function escapeHtml(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// =============================================
// 左メニュー（home.htmlと共通のURL構成）
// =============================================
const URLS = {
  home: 'home.html',
  stock: 'stock_view.html',
  workCalendar: 'work_calendar.html',
  requestCalendar: 'request_calendar.html',
  receptionLog: 'reception_log.html',
  settings: 'business_days_admin.html',
  changeHistory: 'change_history.html'
};
const icons = {
  home: `<path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 001 1h10a1 1 0 001-1v-9"/>`,
  calendar: `<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>`,
  stock: `<path d="M3 8l9-4 9 4-9 4-9-4z"/><path d="M3 8v8l9 4 9-4V8M12 12v8"/>`,
  doc: `<path d="M6 3h9l4 4v14a1 1 0 01-1 1H6a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M14 3v5h5M8 13h3M8 16h6M8 10h2"/>`,
  gear: `<circle cx="12" cy="12" r="3"/><path d="M12 3v2.4M12 18.6V21M4.6 7.3l2 1.2M17.4 15.5l2 1.2M4.6 16.7l2-1.2M17.4 8.5l2-1.2M3 12h2.4M18.6 12H21"/>`,
  truck: `<rect x="1" y="7" width="13" height="10" rx="1"/><path d="M14 10h4l3 3v4h-7z"/><circle cx="6" cy="19" r="1.6"/><circle cx="16.5" cy="19" r="1.6"/>`,
  history: `<path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/>`
};
function icon(name, extra=''){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" ${extra}>${icons[name]}</svg>`; }
function sidebarNavItem(iconName, label, url, active){
  return `<a class="as-item ${active ? 'active' : ''}" href="${active ? '#' : url}">${icon(iconName,'stroke-width="1.8"')}<div class="as-label">${label}</div></a>`;
}
function renderAdminSidebar(){
  const items = [
    ['home','ホーム', URLS.home, false],
    ['calendar','依頼<br>カレンダー', URLS.requestCalendar, false],
    ['truck','作業<br>カレンダー', URLS.workCalendar, false],
    ['doc','受付<br>日報', URLS.receptionLog, false],
    ['stock','在庫表', URLS.stock, false],
    ['history','変更<br>履歴', URLS.changeHistory, true],
    ['gear','設定', URLS.settings, false]
  ];
  document.getElementById('adminSidebarNav').innerHTML = items
    .map(([iconName, label, url, active]) => sidebarNavItem(iconName, label, url, active))
    .join('');
}

async function loginWithGoogle(){
  const { error } = await sbClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href }
  });
  if(error){
    document.getElementById('auth-msg').textContent = 'ログインに失敗しました：' + error.message;
  }
}

// =============================================
// 操作種別の分類（change_historyのtable_name/field_nameから判定）
// =============================================
const TYPE_LABELS = {
  cancel:   { label:'取消',   cls:'cancel' },
  order:    { label:'発注',   cls:'order' },
  progress: { label:'進捗',   cls:'progress' },
  complete: { label:'完成',   cls:'complete' },
  delivery: { label:'配送',   cls:'delivery' }
};
// フィルタチップに出す種別（実際にログが残っている種別のみ）
const CHIP_TYPES = ['cancel','order','progress','complete','delivery'];
// チップで選んだ種別 → 実際のfield_name（delivery系はプレフィックス一致のため別扱い）
const TYPE_FIELD_MAP = {
  cancel:   ['canceled_at','is_canceled'],
  order:    ['order','is_finalized'],
  progress: ['status','stage1_done','stage2_done','qty'],
  complete: ['completed','reflected_to_stock']
};

function rowType(row){
  const f = row.field_name || '';
  if(f.startsWith('delivery_marks.')) return 'delivery';
  if(f === 'canceled_at' || f === 'is_canceled') return 'cancel';
  if(f === 'order' || f === 'is_finalized') return 'order';
  if(f === 'completed' || f === 'reflected_to_stock') return 'complete';
  if(f === 'status' || f === 'stage1_done' || f === 'stage2_done' || f === 'qty') return 'progress';
  return 'other';
}

const TABLE_LABELS = { request_item_dates:'依頼', stock_orders:'発注', stock_items:'在庫' };

// 値の日本語表示
function valueText(field, val){
  if(field.startsWith('delivery_marks.')){
    if(val === null || val === undefined || val === '' || val === 'null') return '未設定';
    if(val === 'prep') return '準備中';
    if(val === 'delivered') return '配送済み';
    return val;
  }
  if(val === null || val === undefined || val === '') return 'ー';
  if(field === 'completed') return val === 'true' ? '完成' : '未完成';
  if(field === 'reflected_to_stock') return val === 'true' ? '反映済み' : '未反映';
  if(field === 'is_finalized') return val === 'true' ? '確定' : '未確定';
  if(field === 'is_canceled') return val === 'true' ? '取消' : 'ー';
  if(field === 'is_hidden') return val === 'true' ? '非表示' : '表示';
  if(field === 'stage1_done' || field === 'stage2_done') return val === 'true' ? '完了' : '未完了';
  return val;
}

// 対象品目のあとに続ける操作内容の一文
function actionText(row){
  const f = row.field_name || '';
  const tableLabel = TABLE_LABELS[row.table_name] || row.table_name;
  if(f === 'order') return `発注登録（${row.new_value || ''}）`;
  if(f === 'canceled_at') return `${tableLabel}を取消`;
  if(f === 'is_canceled') return '発注を取消';
  if(f === 'is_finalized') return row.new_value === 'true' ? '発注を確定' : '発注確定を取消';
  if(f === 'completed') return row.new_value === 'true' ? '完成にした' : '完成を取消';
  if(f === 'reflected_to_stock') return row.new_value === 'true' ? '在庫に反映' : '在庫反映を取消';
  if(f === 'stage1_done') return row.new_value === 'true' ? '工程Aを完了' : '工程Aを未完了に戻す';
  if(f === 'stage2_done') return row.new_value === 'true' ? '工程Bを完了' : '工程Bを未完了に戻す';
  if(f === 'status') return '状態を変更';
  if(f === 'qty') return '数量を変更';
  if(f === 'is_hidden') return row.new_value === 'true' ? '品目を非表示に変更' : '品目を再表示';
  if(f.startsWith('delivery_marks.')) return '配送マークを変更';
  return `${tableLabel}の${f || '項目'}を変更`;
}

// before→afterを別行で見せる必要があるかどうか
function needsChangeLine(field){
  return ['status','qty','completed','reflected_to_stock','is_finalized','stage1_done','stage2_done','is_hidden'].includes(field)
    || field.startsWith('delivery_marks.');
}

// 「要確認」判定：一度確定・完了扱いにしたものを後から取り消した操作
function isReview(row){
  const f = row.field_name || '';
  if(f === 'completed' && row.old_value === 'true' && row.new_value === 'false') return true;
  if(f === 'reflected_to_stock' && row.old_value === 'true' && row.new_value === 'false') return true;
  if(f === 'is_finalized' && row.old_value === 'true' && row.new_value === 'false') return true;
  if(f.startsWith('delivery_marks.') && row.old_value === 'delivered' && (row.new_value === null || row.new_value === '' || row.new_value === 'null')) return true;
  return false;
}

// =============================================
// 状態
// =============================================
let roleByEmail = new Map();
let earliestLoadedFrom = null; // 現在読み込み済みの下限日付(YYYY-MM-DD)
const PAGE_DAYS = 7;
const ROW_LIMIT = 800;

function todayJST(){
  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Tokyo', year:'numeric', month:'2-digit', day:'2-digit' });
  return fmt.format(new Date()); // YYYY-MM-DD
}
function addDaysStr(dateStr, days){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  dt.setUTCDate(dt.getUTCDate() + days);
  return dt.toISOString().slice(0,10);
}
function dateLabelParts(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  return { md: `${m}/${d}`, dow: '日月火水木金土'[dt.getUTCDay()] };
}
function relativeDayLabel(dateStr){
  const today = todayJST();
  if(dateStr === today) return '今日';
  if(dateStr === addDaysStr(today, -1)) return '昨日';
  return null;
}
function timeJST(iso){
  if(!iso) return '';
  const fmt = new Intl.DateTimeFormat('ja-JP', { timeZone:'Asia/Tokyo', hour:'2-digit', minute:'2-digit', hour12:false });
  return fmt.format(new Date(iso));
}
function dateJST(iso){
  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Tokyo', year:'numeric', month:'2-digit', day:'2-digit' });
  return fmt.format(new Date(iso));
}

let state = { actor:'', target:'', from:'', to:'', types:new Set() };
let allRows = [];

function defaultRange(){
  const to = todayJST();
  const from = addDaysStr(to, -6);
  return { from, to };
}

async function loadActorOptions(){
  const { data, error } = await sbClient
    .from('users_allowlist')
    .select('name, email, role')
    .order('name');
  const sel = document.getElementById('fActor');
  if(error || !data){ return; }
  data.forEach(u => { roleByEmail.set(u.email, u.role); });
  const names = [...new Set(data.map(u => u.name))];
  names.forEach(n => {
    const opt = document.createElement('option');
    opt.value = n; opt.textContent = n;
    sel.appendChild(opt);
  });
  const sysOpt = document.createElement('option');
  sysOpt.value = 'システム（自動反映）'; sysOpt.textContent = 'システム（自動反映）';
  sel.appendChild(sysOpt);
}

function renderChips(){
  const wrap = document.getElementById('typeChips');
  wrap.innerHTML = CHIP_TYPES.map(t => `<button class="chip" data-type="${t}">${TYPE_LABELS[t].label}</button>`).join('');
  wrap.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const key = chip.dataset.type;
      if(state.types.has(key)) state.types.delete(key); else state.types.add(key);
      chip.classList.toggle('active');
      reload();
    });
  });
}

function escapeOr(s){
  // PostgRESTのor構文で使う区切り文字（, ) (）をエスケープ的に除去
  return String(s).replace(/[,()]/g, ' ').trim();
}

async function fetchRows(from, to){
  let q = sbClient
    .from('change_history')
    .select('id, table_name, record_id, field_name, old_value, new_value, item_label, requester_name, delivery_date, size_text, changed_by_name, changed_by_email, changed_at')
    .gte('changed_at', `${from}T00:00:00+09:00`)
    .lte('changed_at', `${to}T23:59:59+09:00`)
    .order('changed_at', { ascending:false })
    .limit(ROW_LIMIT);

  if(state.actor) q = q.eq('changed_by_name', state.actor);

  if(state.target){
    const kw = escapeOr(state.target);
    if(kw) q = q.or(`item_label.ilike.%${kw}%,requester_name.ilike.%${kw}%`);
  }

  if(state.types.size){
    const wantsDelivery = state.types.has('delivery');
    const otherFields = [...state.types].filter(t => t !== 'delivery').flatMap(t => TYPE_FIELD_MAP[t] || []);
    if(wantsDelivery && otherFields.length){
      q = q.or(`field_name.in.(${otherFields.join(',')}),field_name.ilike.delivery_marks.*`);
    } else if(wantsDelivery){
      q = q.ilike('field_name', 'delivery_marks.%');
    } else if(otherFields.length){
      q = q.in('field_name', otherFields);
    }
  }

  return await q;
}

async function reload(){
  const errEl = document.getElementById('load-error');
  errEl.style.display = 'none';

  const from = state.from || defaultRange().from;
  const to = state.to || defaultRange().to;
  earliestLoadedFrom = from;

  const { data, error } = await fetchRows(from, to);
  if(error){
    errEl.style.display = 'block';
    errEl.textContent = '履歴の取得に失敗しました：' + error.message;
    return;
  }
  allRows = data || [];
  render();
}

async function loadMore(){
  const btn = document.getElementById('loadMoreBtn');
  btn.disabled = true; btn.textContent = '読み込み中...';

  const to = earliestLoadedFrom ? addDaysStr(earliestLoadedFrom, -1) : defaultRange().to;
  const from = addDaysStr(to, -(PAGE_DAYS - 1));

  const { data, error } = await fetchRows(from, to);
  btn.disabled = false; btn.textContent = 'さらに1週間さかのぼって読み込む';

  if(error){
    document.getElementById('load-error').style.display = 'block';
    document.getElementById('load-error').textContent = '履歴の取得に失敗しました：' + error.message;
    return;
  }
  earliestLoadedFrom = from;
  allRows = allRows.concat(data || []);
  render();
}

function groupByDate(list){
  const map = new Map();
  list.forEach(r => {
    const d = dateJST(r.changed_at);
    if(!map.has(d)) map.set(d, []);
    map.get(d).push(r);
  });
  return [...map.entries()].sort((a,b) => (a[0] < b[0] ? 1 : -1));
}

function isProxy(row){
  if(!row.requester_name || !row.changed_by_name) return false;
  if(row.requester_name === row.changed_by_name) return false;
  return roleByEmail.get(row.changed_by_email) === '管理者';
}

function rowHtml(row){
  const type = rowType(row);
  const typeInfo = TYPE_LABELS[type] || { label:'その他', cls:'other' };
  const proxy = isProxy(row);
  const review = isReview(row);
  const target = row.item_label || TABLE_LABELS[row.table_name] || '';
  const change = needsChangeLine(row.field_name)
    ? `<div class="d-change">${escapeHtml(valueText(row.field_name, row.old_value))}<span class="arrow">→</span>${escapeHtml(valueText(row.field_name, row.new_value))}</div>`
    : '';
  return `
    <div class="log-row ${review ? 'flag' : ''}">
      <div class="lg-time">${escapeHtml(timeJST(row.changed_at))}</div>
      <div class="lg-actor">
        <div class="a-name">${escapeHtml(row.changed_by_name || '-')}</div>
      </div>
      <div class="lg-type"><span class="type-badge ${typeInfo.cls}">${typeInfo.label}</span></div>
      <div class="lg-detail">
        <div class="d-target">
          ${escapeHtml(target)}
          ${proxy ? '<span class="tag proxy">代理</span>' : ''}
          ${review ? '<span class="tag review">要確認</span>' : ''}
        </div>
        <div class="d-action">${escapeHtml(actionText(row))}</div>
        ${change}
      </div>
    </div>`;
}

function render(){
  document.getElementById('resultCount').textContent = allRows.length;

  const grouped = groupByDate(allRows);
  const area = document.getElementById('logArea');

  if(grouped.length === 0){
    area.innerHTML = `<div class="empty-state">条件に一致する操作履歴はありません</div>`;
  } else {
    area.innerHTML = grouped.map(([date, items]) => {
      const rel = relativeDayLabel(date);
      const parts = dateLabelParts(date);
      return `
      <div class="day-group">
        <div class="day-heading">
          <span class="dh-date">${rel ? rel : parts.md}</span>
          <span class="dh-dow">${rel ? parts.md : parts.dow + '曜日'}</span>
          <span class="dh-count">${items.length}件</span>
        </div>
        <div class="log-table">
          ${items.map(rowHtml).join('')}
        </div>
      </div>`;
    }).join('');
  }

  document.getElementById('loadMoreWrap').style.display = allRows.length >= ROW_LIMIT ? 'none' : 'flex';
}

// =============================================
// イベント
// =============================================
function bindEvents(){
  document.getElementById('fActor').addEventListener('change', e => { state.actor = e.target.value; reload(); });
  document.getElementById('fTarget').addEventListener('input', debounce(e => { state.target = e.target.value; reload(); }, 350));
  document.getElementById('fFrom').addEventListener('change', e => { state.from = e.target.value; reload(); });
  document.getElementById('fTo').addEventListener('change', e => { state.to = e.target.value; reload(); });
  document.getElementById('resetBtn').addEventListener('click', () => {
    const def = defaultRange();
    state = { actor:'', target:'', from:'', to:'', types:new Set() };
    document.getElementById('fActor').value = '';
    document.getElementById('fTarget').value = '';
    document.getElementById('fFrom').value = def.from;
    document.getElementById('fTo').value = def.to;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    reload();
  });
  document.getElementById('loadMoreBtn').addEventListener('click', loadMore);
}
function debounce(fn, ms){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

// =============================================
// 認証
// =============================================
async function initAuth(){
  const { data: { user } } = await sbClient.auth.getUser();

  if(!user){
    document.getElementById('auth-loading').style.display='none';
    document.getElementById('auth-login').style.display='block';
    return;
  }

  const { data: allowRow, error: allowErr } = await sbClient
    .from('users_allowlist')
    .select('name, role')
    .eq('email', user.email)
    .maybeSingle();

  if(allowErr || !allowRow || !allowRow.name || allowRow.role !== '管理者'){
    document.getElementById('auth-loading').style.display='none';
    document.getElementById('auth-denied').style.display='block';
    return;
  }

  currentUser.email = user.email;
  currentUser.name = allowRow.name;
  currentUser.role = allowRow.role;

  document.getElementById('login-name-display').textContent = currentUser.name;
  document.getElementById('auth-loading').style.display='none';
  document.getElementById('admin-shell').style.display='flex';
  document.getElementById('app-content').style.display='block';
  renderAdminSidebar();

  const def = defaultRange();
  document.getElementById('fFrom').value = def.from;
  document.getElementById('fTo').value = def.to;

  renderChips();
  bindEvents();
  await loadActorOptions();
  await reload();
}

initAuth();
