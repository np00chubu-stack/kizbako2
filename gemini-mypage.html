<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マイページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+JP:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #090C10;
  --bg-card: #121824;
  --bg-card-hover: #182030;
  --panel-border: rgba(255, 255, 255, 0.12);
  
  --text-main: #F0F4F8;
  --text-sub: #8B9BB4;
  --text-dim: #4E5D78;
  
  --cyan: #00F0FF;
  --cyan-glow: rgba(0, 240, 255, 0.25);
  --blue: #2B7FFF;
  --amber: #FFB800;
  --amber-glow: rgba(255, 184, 0, 0.2);
  --red: #FF3B5C;
  --red-glow: rgba(255, 59, 92, 0.25);
  --green: #00E676;
  --green-glow: rgba(0, 230, 118, 0.2);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg-dark);
  background-image: 
    linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--text-main);
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  letter-spacing: 0.02em;
}

.mono { font-family: 'JetBrains Mono', monospace; }
.tech-font { font-family: 'Chakra Petch', sans-serif; text-transform: uppercase; }

.page-wrap {
  max-width: 820px;
  margin: 0 auto;
  padding: 20px 14px 40px;
}

.phone {
  width: 100%;
  max-width: 390px;
  aspect-ratio: 375/812;
  margin: 0 auto;
  background: var(--bg-dark);
  border: 1px solid rgba(0, 240, 255, 0.3);
  border-radius: 28px;
  box-shadow: 0 0 35px rgba(0, 240, 255, 0.1), inset 0 0 15px rgba(0, 0, 0, 0.8);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}

.notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 40%;
  height: 20px;
  background: #000;
  border-bottom-left-radius: 12px;
  border-bottom-right-radius: 12px;
  border: 1px solid var(--panel-border);
  border-top: none;
  z-index: 5;
}

.login-box {
  max-width: 360px;
  margin: 80px auto;
  text-align: center;
  padding: 30px 20px;
  background: var(--bg-card);
  border: 1px solid var(--panel-border);
  clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
}

.login-box h1 {
  font-size: 20px;
  font-weight: 800;
  color: var(--text-main);
  margin-bottom: 24px;
  letter-spacing: 0.1em;
}

.btn-google {
  width: 100%;
  padding: 14px 26px;
  background: var(--cyan);
  color: #000;
  border: none;
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  font-size: 14px;
  font-weight: 800;
  font-family: 'Chakra Petch', 'Noto Sans JP', sans-serif;
  cursor: pointer;
  box-shadow: 0 0 15px var(--cyan-glow);
  transition: all 0.2s ease;
}

.btn-google:hover {
  background: #fff;
  box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
}

#auth-loading { text-align: center; padding: 80px 0; color: var(--text-sub); font-size: 14px; }
#auth-msg { margin-top: 14px; font-size: 13px; color: var(--red); }
.login-box p { font-size: 13.5px; color: var(--red); line-height: 1.6; }

.app-header {
  flex: 0 0 auto;
  padding: 30px 20px 12px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  border-bottom: 1px solid var(--panel-border);
  background: rgba(18, 24, 36, 0.6);
  backdrop-filter: blur(8px);
}

.app-header .eyebrow {
  font-size: 10px;
  color: var(--cyan);
  font-weight: 700;
  letter-spacing: 0.15em;
  margin-bottom: 2px;
}

.app-header h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 0.05em;
}

.back-icon {
  width: 36px;
  height: 36px;
  border: 1px solid var(--panel-border);
  background: var(--bg-card);
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-sub);
  cursor: pointer;
  transition: all 0.2s ease;
}

.back-icon:hover { border-color: var(--cyan); color: var(--cyan); }
.back-icon svg { width: 16px; height: 16px; }

.login-name-bar {
  font-size: 10px;
  color: var(--text-sub);
  padding: 8px 20px;
  background: rgba(0, 0, 0, 0.4);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  letter-spacing: 0.05em;
}

.app-content {
  flex: 1 1 auto;
  min-height: 0;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}

.action-banner {
  display: none;
  flex: 0 0 auto;
  align-items: center;
  gap: 12px;
  background: linear-gradient(135deg, rgba(0, 240, 255, 0.15) 0%, rgba(43, 127, 255, 0.15) 100%);
  border: 1px solid var(--cyan);
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  padding: 12px 16px;
  box-shadow: inset 0 0 15px var(--cyan-glow);
}

.action-banner.show { display: flex; }

.action-banner .ab-icon {
  width: 32px;
  height: 32px;
  background: var(--cyan);
  color: #000;
  clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.action-banner .ab-icon svg { width: 18px; height: 18px; }
.action-banner .ab-title { font-size: 13px; font-weight: 800; color: #fff; }
.action-banner .ab-sub { font-size: 10px; color: var(--cyan); margin-top: 1px; }

.section-label {
  flex: 0 0 auto;
  font-size: 11px;
  font-weight: 800;
  color: var(--cyan);
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: 0.1em;
}

.section-label::before {
  content: '';
  display: inline-block;
  width: 4px;
  height: 12px;
  background: var(--cyan);
}

.section-label .sl-count { font-weight: 500; color: var(--text-sub); font-size: 10px; }
.req-list { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; }

.ready-card {
  background: var(--bg-card);
  border: 1px solid var(--amber);
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  cursor: pointer;
  box-shadow: 0 0 10px var(--amber-glow);
  transition: all 0.2s ease;
}

.ready-card:hover { background: var(--bg-card-hover); box-shadow: 0 0 20px var(--amber-glow); }
.ready-card .rc-date { color: var(--amber); }
.ready-card .ready-arrow { background: var(--amber); color: #000; }

.ready-card.ordered { border-color: var(--blue); box-shadow: none; }
.ready-card.ordered .ready-arrow { background: var(--blue); color: #fff; }
.ready-card.ordered .rc-date { color: var(--blue); }

.ready-main .rc-date { font-size: 10px; font-weight: 700; }
.ready-main .rc-name { font-size: 13px; font-weight: 800; margin-top: 2px; color: var(--text-main); }
.ready-main .rc-detail { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

.ready-arrow {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
  display: flex;
  align-items: center;
  justify-content: center;
}
.ready-arrow svg { width: 14px; height: 14px; }

.plain-list {
  background: var(--bg-card);
  border: 1px solid var(--panel-border);
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  overflow: hidden;
}

.plain-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-top: 1px solid var(--panel-border);
  cursor: pointer;
  transition: background 0.2s ease;
}

.plain-row:first-child { border-top: none; }
.plain-row:hover { background: var(--bg-card-hover); }

.plain-row .pr-date { font-size: 10px; color: var(--text-sub); width: 38px; flex-shrink: 0; }
.plain-row .pr-main { flex: 1; min-width: 0; }
.plain-row .pr-name { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plain-row.is-cancelled .pr-name { text-decoration: line-through; color: var(--text-dim); }
.plain-row .pr-detail { font-size: 10px; color: var(--text-sub); margin-top: 2px; }

.urgent-tag {
  font-size: 9px;
  font-weight: 800;
  color: #fff;
  background: var(--red);
  padding: 1px 6px;
  clip-path: polygon(0 0, calc(100% - 4px) 0, 100% 4px, 100% 100%, 4px 100%, 0 calc(100% - 4px));
  margin-left: 6px;
  display: inline-block;
}

.status-pill {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 9.5px;
  font-weight: 700;
  padding: 3px 8px;
  clip-path: polygon(0 0, calc(100% - 4px) 0, 100% 4px, 100% 100%, 4px 100%, 0 calc(100% - 4px));
  white-space: nowrap;
}

.status-pill svg { width: 10px; height: 10px; }
.status-pill.ok { background: rgba(43, 127, 255, 0.15); color: var(--blue); border: 1px solid rgba(43, 127, 255, 0.4); }
.status-pill.wip { background: var(--amber-glow); color: var(--amber); border: 1px solid rgba(255, 184, 0, 0.4); }
.status-pill.ready { background: var(--green-glow); color: var(--green); border: 1px solid rgba(0, 230, 118, 0.4); }
.status-pill.done { background: rgba(255, 255, 255, 0.1); color: var(--text-sub); border: 1px solid var(--panel-border); }
.status-pill.canceled { background: rgba(255, 59, 92, 0.15); color: var(--red); border: 1px solid rgba(255, 59, 92, 0.4); }
.status-pill.partial { background: var(--amber-glow); color: var(--amber); border: 1px solid rgba(255, 184, 0, 0.4); }

.empty-note { text-align: center; padding: 20px 10px; color: var(--text-dim); font-size: 11px; }
#load-error { text-align: center; color: var(--red); font-size: 11px; padding: 10px 0; }

.spacer { flex: 1 1 auto; }

.tabbar {
  flex: 0 0 auto;
  display: flex;
  border-top: 1px solid var(--panel-border);
  background: rgba(18, 24, 36, 0.95);
  backdrop-filter: blur(10px);
  padding: 8px 4px 12px;
}

.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  color: var(--text-sub);
  text-decoration: none;
  cursor: pointer;
  background: none;
  border: none;
  transition: color 0.2s ease;
}

.tab svg { width: 18px; height: 18px; }
.tab .tlabel { font-size: 9px; font-weight: 700; letter-spacing: 0.05em; }
.tab.active { color: var(--cyan); }
.tab.active svg { filter: drop-shadow(0 0 5px var(--cyan)); }

.sheet-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(4px);
  z-index: 20;
  display: flex;
  align-items: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.sheet-overlay.show { opacity: 1; pointer-events: auto; }

.sheet {
  width: 100%;
  background: var(--bg-card);
  border-top: 1px solid var(--cyan);
  box-shadow: 0 -10px 30px rgba(0, 240, 255, 0.15);
  padding: 12px 20px 24px;
  max-height: 85%;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.sheet-overlay.show .sheet { transform: translateY(0); }

.sheet-handle {
  width: 40px;
  height: 3px;
  background: var(--cyan);
  opacity: 0.5;
  margin: 4px auto 16px;
}

.sheet-title { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: 0.05em; }
.sheet-sub { font-size: 11px; color: var(--text-sub); margin-top: 4px; }

.sheet-meta { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.sheet-meta .mrow {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  border-top: 1px solid var(--panel-border);
  padding-top: 10px;
}

.sheet-meta .mrow:first-child { border-top: none; padding-top: 0; }
.sheet-meta .mk { color: var(--text-sub); }
.sheet-meta .mv { font-weight: 700; text-align: right; color: var(--text-main); }

.edit-area { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--panel-border); }
.edit-area .edit-title { font-size: 11px; font-weight: 800; color: var(--cyan); margin-bottom: 10px; letter-spacing: 0.05em; }
.edit-area label { display: block; font-size: 11px; color: var(--text-sub); margin-bottom: 4px; }

.edit-area input[type="date"],
.edit-area input[type="number"],
.date-input {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg-dark);
  border: 1px solid var(--panel-border);
  color: var(--text-main);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  margin-bottom: 12px;
  outline: none;
  transition: border-color 0.2s ease;
}

.edit-area input[type="date"]:focus,
.edit-area input[type="number"]:focus,
.date-input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 10px var(--cyan-glow);
}

.edit-note {
  font-size: 11px;
  color: var(--amber);
  background: var(--amber-glow);
  border: 1px solid rgba(255, 184, 0, 0.3);
  padding: 10px;
  margin-bottom: 12px;
  line-height: 1.5;
}

.mode-tabs { display: flex; gap: 8px; margin-top: 18px; }

.mode-tab {
  flex: 1;
  appearance: none;
  border: 1px solid var(--panel-border);
  background: var(--bg-dark);
  cursor: pointer;
  padding: 10px 4px;
  text-align: center;
  transition: all 0.2s ease;
}

.mode-tab .mt-emoji { font-size: 16px; color: var(--text-sub); font-family: 'Chakra Petch', sans-serif; }
.mode-tab .mt-label { font-size: 10px; font-weight: 800; margin-top: 4px; color: var(--text-sub); letter-spacing: 0.05em; }

.mode-tab.active {
  border-color: var(--cyan);
  background: rgba(0, 240, 255, 0.1);
  box-shadow: 0 0 10px var(--cyan-glow);
}

.mode-tab.active .mt-emoji,
.mode-tab.active .mt-label { color: var(--cyan); }

.mode-body { margin-top: 16px; min-height: 50px; }
.mode-body .mb-desc { font-size: 11px; color: var(--text-sub); line-height: 1.5; margin-bottom: 12px; }

.qty-stepper { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 10px 0; }

.qty-stepper button {
  width: 36px;
  height: 36px;
  border: 1px solid var(--cyan);
  background: var(--bg-dark);
  font-size: 18px;
  font-weight: 800;
  color: var(--cyan);
  cursor: pointer;
  transition: all 0.15s ease;
}

.qty-stepper button:active { background: var(--cyan); color: #000; }
.qty-stepper .qs-val { font-size: 22px; font-weight: 800; min-width: 50px; text-align: center; color: var(--text-main); }

.sheet-confirm {
  width: 100%;
  margin-top: 18px;
  appearance: none;
  border: none;
  cursor: pointer;
  background: var(--cyan);
  color: #000;
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  font-family: 'Chakra Petch', 'Noto Sans JP', sans-serif;
  font-weight: 800;
  font-size: 14px;
  padding: 12px 0;
  box-shadow: 0 0 15px var(--cyan-glow);
  transition: all 0.2s ease;
}

.sheet-confirm:hover { background: #fff; box-shadow: 0 0 25px rgba(255, 255, 255, 0.5); }

.sheet-cancel-link {
  width: 100%;
  margin-top: 10px;
  appearance: none;
  cursor: pointer;
  background: transparent;
  border: 1px solid var(--red);
  color: var(--red);
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 700;
  font-size: 12px;
  padding: 10px 0;
  transition: all 0.2s ease;
}

.sheet-cancel-link:hover { background: var(--red-glow); }

.sheet-close {
  width: 100%;
  margin-top: 10px;
  appearance: none;
  border: none;
  cursor: pointer;
  background: none;
  color: var(--text-sub);
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 700;
  font-size: 11px;
  padding: 6px 0;
  transition: color 0.2s ease;
}

.sheet-close:hover { color: var(--text-main); }
.sheet-note { margin-top: 10px; font-size: 10.5px; color: var(--red); text-align: center; line-height: 1.5; }
</style>
</head>
<body>

<div id="auth-loading" class="login-box" style="margin-top:80px">
  <div class="tech-font" style="color:var(--cyan);font-size:14px;letter-spacing:0.1em;">SYSTEM LOADING...</div>
</div>

<div id="auth-login" class="login-box" style="display:none">
  <h1 class="tech-font">MY PAGE</h1>
  <button class="btn-google" onclick="loginWithGoogle()">Googleでログイン</button>
  <div id="auth-msg"></div>
</div>

<div id="auth-denied" class="login-box" style="display:none">
  <h1 class="tech-font">ACCESS DENIED</h1>
  <p>このアカウントはまだ利用登録されていません。管理者に連絡してください。</p>
</div>

<div id="app-content" class="page-wrap" style="display:none">
  <div class="phone" id="phoneFrame">
    <div class="notch"></div>
    <div class="app-header">
      <div>
        <div class="eyebrow tech-font">MANAGEMENT SYSTEM</div>
        <h1 class="tech-font">MY PAGE</h1>
      </div>
      <a class="back-icon" href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      </a>
    </div>
    <div class="login-name-bar">USER: <span id="login-name-display" style="color:var(--text-main);font-weight:700;"></span></div>

    <div class="app-content">
      <div class="action-banner" id="action-banner">
        <div class="ab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
        <div>
          <div class="ab-title" id="ab-title"></div>
          <div class="ab-sub">タップして発注してください</div>
        </div>
      </div>

      <div class="section-label tech-font">READY ITEMS <span class="sl-count mono" id="count-ready"></span></div>
      <div class="req-list" id="list-ready"></div>

      <div class="section-label tech-font">REQUEST LIST <span class="sl-count mono" id="count-all"></span></div>
      <div id="list-all"></div>

      <div id="load-error" style="display:none"></div>
      <div class="spacer"></div>
    </div>

    <div class="tabbar" id="tabbar"></div>

    <!-- 詳細ボトムシート -->
    <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet(event)">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <div class="sheet-title" id="sheet-title"></div>
        <div class="sheet-meta" id="sheet-detail"></div>
        <div id="sheet-edit-area"></div>
        <div class="sheet-note" id="sheet-cancel-msg"></div>
        <button class="sheet-cancel-link" id="order-cancel-btn" style="display:none" onclick="cancelOrderFromDetailSheet()">発注を取消す</button>
        <button class="sheet-cancel-link" id="sheet-cancel-btn" style="display:none" onclick="cancelFromDetailSheet()">この納入日の依頼を取り消す</button>
        <button class="sheet-close" onclick="closeSheet()">閉じる</button>
      </div>
    </div>

    <!-- 発注設定ボトムシート -->
    <div class="sheet-overlay" id="order-sheet-overlay" onclick="closeOrderSheet(event)">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <div class="sheet-title" id="order-sheet-title"></div>
        <div class="sheet-sub" id="order-sheet-detail"></div>

        <div class="mode-tabs" id="orderModeTabs">
          <button type="button" class="mode-tab" data-mode="circle"><div class="mt-emoji">[ O ]</div><div class="mt-label">完成次第</div></button>
          <button type="button" class="mode-tab" data-mode="qty"><div class="mt-emoji">[ # ]</div><div class="mt-label">数量指定</div></button>
          <button type="button" class="mode-tab" data-mode="date"><div class="mt-emoji">[ D ]</div><div class="mt-label">日付指定</div></button>
        </div>
        <div class="mode-body" id="orderModeBody"></div>

<script>
const SUPABASE_URL = 'https://tguqfgdodevwowydkrkq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OH2iHpq9DIukdzNMUR0lyw_sfVyATp6';
const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = { email: '', name: '' };

async function logChange(tableName, recordId, fieldName, oldValue, newValue, itemLabel, requesterName, deliveryDate, sizeTxt){
  await sbClient.from('change_history').insert({
    table_name: tableName,
    record_id: recordId,
    field_name: fieldName,
    old_value: oldValue === null || oldValue === undefined ? null : String(oldValue),
    new_value: newValue === null || newValue === undefined ? null : String(newValue),
    item_label: itemLabel || null,
    requester_name: requesterName || null,

    size_text: sizeTxt || null,
    changed_by_name: currentUser.name,
    changed_by_email: currentUser.email
  });
}

let myItems = [];

function escapeHtml(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const HIDDEN_CATEGORY_LABELS = ['3000まで', '3001以上'];
function displayCategory(cat, itemName){
  return HIDDEN_CATEGORY_LABELS.includes(cat) ? (itemName || '') : (cat || '');
}

function sizeText(row){
  return [row.size_l, row.size_w, row.size_h].filter(v=>v!=null).join('×') || (row.item_name || '');
}

let lockSettings = { start: null, end: null };
let isLocked = false;

async function loadLockSettings(){
  const { data, error } = await sbClient
    .from('business_settings')
    .select('lock_start_time, lock_end_time')
    .limit(1)
    .maybeSingle();

  if(error || !data){ isLocked = false; return; }

  lockSettings.start = data.lock_start_time;
  lockSettings.end = data.lock_end_time;

  const now = new Date();
  const nowStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':00';
  isLocked = (nowStr >= lockSettings.start && nowStr < lockSettings.end);
}

function isTodayJST(isoString){
  if(!isoString) return false;
  const fmt = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Tokyo', year:'numeric', month:'2-digit', day:'2-digit' });
  return fmt.format(new Date(isoString)) === fmt.format(new Date());
}

function shortDate(ymd){
  const m = String(ymd).match(/^\d{4}-(\d{1,2})-(\d{1,2})/);
  return m ? `${parseInt(m[1],10)}/${parseInt(m[2],10)}` : ymd;
}

function statusClass(label){
  if(label === '取消済み') return 'canceled';
  if(label === '発注済み') return 'done';
  if(label === '受付済み') return 'ok';
  if(label === '作業中') return 'wip';
  if(label === '発注可能') return 'ready';
  return 'ok';
}
function statusIcon(cls){
  if(cls === 'wip') return '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>';
  if(cls === 'canceled') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 12h12"/></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
}

function renderReadyCard(row){
  const urgentTag = row.is_urgent ? '<span class="urgent-tag">急ぎ</span>' : '';
  const isOrdered = row.status === '発注済み・受取待ち';
  const isPartial = !isOrdered && row.ordered_qty && row.ordered_qty > 0 && row.ordered_qty < row.qty;
  const cardClass = isOrdered ? 'ready-card ordered' : (isPartial ? 'ready-card partial' : 'ready-card');
  const clickHandler = isOrdered ? `openSheet('${row.id}')` : `openOrderSheet('${row.id}')`;
  const orderedBadge = isOrdered
    ? '<span class="status-pill done" style="margin-right:5px">発注済み</span>'
    : (isPartial ? `<span class="status-pill partial" style="margin-right:5px">一部発注済み(${row.ordered_qty}/${row.qty})</span>` : '');
  return `
    <div class="${cardClass}" onclick="${clickHandler}">
      <div class="ready-main">
        <div class="rc-date mono">希望日 ${escapeHtml(shortDate(row.delivery_date))}</div>
        <div class="rc-name">${orderedBadge}${escapeHtml(displayCategory(row.category, row.item_name))}${urgentTag}</div>
        <div class="rc-detail">${escapeHtml(sizeText(row))} ${escapeHtml(String(row.qty))}c/s</div>
      </div>
      <div class="ready-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
    </div>`;
}

function renderListRow(row){
  const cancelled = !!row.canceled_at;
  const isOrdered = row.status === '発注済み・受取待ち';
  const label = cancelled ? '取消済み' : (isOrdered ? '発注済み' : row.status);
  const cls = statusClass(label);
  const urgentTag = row.is_urgent ? '<span class="urgent-tag">急ぎ</span>' : '';
  return `
    <div class="plain-row${cancelled ? ' is-cancelled' : ''}" onclick="openSheet('${row.id}')">
      <div class="pr-date mono">${escapeHtml(shortDate(row.delivery_date))}</div>
      <div class="pr-main">
        <div class="pr-name">${escapeHtml(displayCategory(row.category, row.item_name))}${urgentTag}</div>
        <div class="pr-detail">${escapeHtml(sizeText(row))} ${escapeHtml(String(row.qty))}c/s</div>
      </div>
      <span class="status-pill ${cls}">${statusIcon(cls)}<span>${escapeHtml(label)}</span></span>
    </div>`;
}

function renderList(){
  const readyRows = myItems
    .filter(r => !r.canceled_at && (r.status === '発注可能' || r.status === '発注済み・受取待ち'))
    .sort((a,b) => {
      const pa = a.status === '発注可能' ? 0 : 1;
      const pb = b.status === '発注可能' ? 0 : 1;
      if(pa !== pb) return pa - pb;
      return a.delivery_date.localeCompare(b.delivery_date);
    });
  const unorderedCount = readyRows.filter(r => r.status === '発注可能').length;

  const listRows = myItems
    .filter(r => r.status === '受付済み' || r.status === '作業中' || r.canceled_at)
    .sort((a,b) => a.delivery_date.localeCompare(b.delivery_date));

  const banner = document.getElementById('action-banner');
  if(unorderedCount){
    banner.classList.add('show');
    document.getElementById('ab-title').textContent = `${unorderedCount}件の完成品があります`;
  } else {
    banner.classList.remove('show');
  }

  document.getElementById('count-ready').textContent = readyRows.length ? `(${readyRows.length})` : '';
  document.getElementById('count-all').textContent = listRows.length ? `(${listRows.length})` : '';

  document.getElementById('list-ready').innerHTML = readyRows.length
    ? readyRows.map(renderReadyCard).join('')
    : '<div class="empty-note">現在、完成品はありません</div>';

  document.getElementById('list-all').innerHTML = listRows.length
    ? `<div class="plain-list">${listRows.map(renderListRow).join('')}</div>`
    : '<div class="plain-list"><div class="empty-note">依頼中のものはありません</div></div>';
}

function renderEditArea(row){
  if(row.canceled_at) return '';
  if(row.status !== '受付済み' && row.status !== '作業中') return '';

  const qtyFieldHtml = row.status === '受付済み'
    ? `<label>数量(c/s)</label><input type="number" id="edit-qty-input" min="1" value="${row.qty}">`
    : `<div class="edit-note">数量の変更は管理者へご連絡ください（作業に取りかかっているため）</div>`;

  return `
    <div class="edit-area">
      <div class="edit-title">日程・数量の変更</div>
      <label>納入日</label>
      <input type="date" id="edit-date-input" value="${row.delivery_date}">

}

async function saveEditChanges(dateRowId){
  const row = myItems.find(r => r.id === dateRowId);
  if(!row) return;

  const dateInput = document.getElementById('edit-date-input');
  const newDate = dateInput ? dateInput.value : '';
  const msgEl = document.getElementById('sheet-edit-msg');

  if(!newDate){ msgEl.textContent = '納入日を入力してください。'; return; }

  const payload = {
    delivery_date: newDate,
    last_changed_by: currentUser.name,
    last_changed_at: new Date().toISOString()
  };

  if(newDate !== row.delivery_date){
    if(!row.pending_changed_at){
      payload.pending_before_date = row.delivery_date;
    }
    payload.pending_changed_at = new Date().toISOString();
  }

  if(row.status === '受付済み'){
    const qtyInput = document.getElementById('edit-qty-input');
    const newQty = qtyInput ? parseInt(qtyInput.value, 10) : NaN;
    if(!newQty || newQty < 1){ msgEl.textContent = '数量を入力してください。'; return; }
    payload.qty = newQty;
  }

  const { error } = await sbClient
    .from('request_item_dates')
    .update(payload)
    .eq('id', dateRowId);

  if(error){
    msgEl.textContent = '変更に失敗しました：' + error.message;
    return;
  }

  document.getElementById('sheet-overlay').classList.remove('show');
  await loadMyItems();
}

let orderSheetState = { dateRowId: null, stockItemId: null, mode: 'circle', qty: 1, date: '' };

async function openOrderSheet(dateRowId){
  if(isLocked){ alert('ただいまロック中のため、発注はできません。'); return; }
  const row = myItems.find(r => r.id === dateRowId);
  if(!row) return;

  const { data: stockRow, error } = await sbClient
    .from('stock_items')
    .select('id')
    .eq('request_item_date_id', dateRowId)
    .maybeSingle();

  if(error || !stockRow){
    alert('在庫データが見つかりませんでした。時間をおいて再度お試しください。');
    return;
  }

  orderSheetState = { dateRowId, stockItemId: stockRow.id, mode: 'circle', qty: 1, date: '', existingOrderId: null, existingMode: null, existingQty: 0, totalQty: row.qty };

  const { data: existingOrder } = await sbClient
    .from('stock_orders')
    .select('id, mode, qty')
    .eq('stock_item_id', stockRow.id)
    .eq('is_canceled', false)
    .maybeSingle();

  let progressNote = '';
  if(existingOrder){
    orderSheetState.existingOrderId = existingOrder.id;
    orderSheetState.existingMode = existingOrder.mode;
    orderSheetState.existingQty = existingOrder.qty || 0;
    if(existingOrder.mode === '数量' && existingOrder.qty < row.qty){
      orderSheetState.mode = 'qty';
      orderSheetState.qty = Math.max(1, row.qty - existingOrder.qty);
      progressNote = `<div class="mb-desc">これまでに${existingOrder.qty}個発注済み。残り${row.qty - existingOrder.qty}個です。</div>`;
    }
  }

  document.getElementById('order-sheet-title').textContent = displayCategory(row.category, row.item_name);
  document.getElementById('order-sheet-detail').innerHTML = `${escapeHtml(sizeText(row))}／納入日：${escapeHtml(row.delivery_date)}（${escapeHtml(String(row.qty))}c/s）${progressNote}`;
  document.getElementById('order-sheet-msg').textContent = '';

  renderOrderModeTabs();
  renderOrderModeBody();

  document.getElementById('order-sheet-overlay').classList.add('show');
}

function renderOrderModeTabs(){
  document.querySelectorAll('#orderModeTabs .mode-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.mode === orderSheetState.mode);
    el.onclick = () => { orderSheetState.mode = el.dataset.mode; renderOrderModeTabs(); renderOrderModeBody(); };
  });
}

function renderOrderModeBody(){
  const body = document.getElementById('orderModeBody');
  if(orderSheetState.mode === 'circle'){
    body.innerHTML = `<div class="mb-desc">完成次第、すぐ受け取りたい場合はこちらを選びます。</div>`;
  } else if(orderSheetState.mode === 'qty'){
    body.innerHTML = `
      <div class="mb-desc">今回はこの数だけ欲しい場合に指定します(部分発注)。</div>
      <div class="qty-stepper">
        <button type="button" id="orderQtyMinus">−</button>
        <div class="qs-val mono" id="orderQtyVal">${orderSheetState.qty}</div>
        <button type="button" id="orderQtyPlus">＋</button>
      </div>`;
    document.getElementById('orderQtyMinus').onclick = () => { if(orderSheetState.qty > 1) orderSheetState.qty--; document.getElementById('orderQtyVal').textContent = orderSheetState.qty; };
    document.getElementById('orderQtyPlus').onclick = () => {
      const baseQty = (orderSheetState.existingMode === '数量') ? orderSheetState.existingQty : 0;
      const maxQty = orderSheetState.totalQty ? (orderSheetState.totalQty - baseQty) : Infinity;
      if(orderSheetState.qty < maxQty) orderSheetState.qty++;
      document.getElementById('orderQtyVal').textContent = orderSheetState.qty;
    };
  } else if(orderSheetState.mode === 'date'){
    body.innerHTML = `
      <div class="mb-desc">受け取りたい日を指定できます。</div>
      <input type="date" class="date-input" id="orderDateInput" value="${orderSheetState.date}">`;
    document.getElementById('orderDateInput').oninput = (e) => { orderSheetState.date = e.target.value; };
  }
}

async function submitOrderFromMypage(){
  if(isLocked){
    document.getElementById('order-sheet-msg').textContent = 'ただいまロック中のため、発注はできません。';
    return;
  }
  const mode = orderSheetState.mode;
  const msgEl = document.getElementById('order-sheet-msg');
  msgEl.textContent = '';

  let qty = null, desiredDate = null;
  if(mode === 'qty'){
    qty = orderSheetState.qty;
    if(!qty || qty < 1){ msgEl.textContent = '数量を入力してください。'; return; }
  }
  if(mode === 'date'){
    desiredDate = orderSheetState.date;
    if(!desiredDate){ msgEl.textContent = '希望日を入力してください。'; return; }
  }

  const modeLabel = mode === 'circle' ? '○' : (mode === 'qty' ? '数量' : '日付');
  const { existingOrderId, existingMode, existingQty, totalQty } = orderSheetState;
  const r_now = myItems.find(r => r.id === orderSheetState.dateRowId);

  if(modeLabel === '数量' && totalQty){
    const baseQty = (existingMode === '数量') ? existingQty : 0;
    if(baseQty + qty > totalQty){
      msgEl.textContent = `発注数が残数（${totalQty - baseQty}個）を超えています。`;
      return;
    }
  }

  let cumulativeQty = qty;

  if(modeLabel === '数量' && existingOrderId && existingMode === '数量'){
    cumulativeQty = existingQty + qty;
    const { error: updErr } = await sbClient
      .from('stock_orders')
      .update({ qty: cumulativeQty })
      .eq('id', existingOrderId);
    if(updErr){
      msgEl.textContent = '発注に失敗しました：' + updErr.message;
      return;
    }
    await logChange('stock_orders', existingOrderId, 'qty', existingQty, cumulativeQty, r_now?.category, currentUser.name, r_now?.delivery_date, r_now ? sizeText(r_now) : null);
  } else {
    const { error: orderErr } = await sbClient.from('stock_orders').insert({
      stock_item_id: orderSheetState.stockItemId,
      operated_by_email: currentUser.email,
      operated_by_name: currentUser.name,
      destination: null,
      mode: modeLabel,
      qty: qty,
      desired_date: desiredDate,
      is_proxy: false,
      is_canceled: false
    });

    if(orderErr){
      msgEl.textContent = '発注に失敗しました：' + orderErr.message;
      return;
    }

    if(existingOrderId){
      const { error: cancelErr } = await sbClient.from('stock_orders').update({ is_canceled: true }).eq('id', existingOrderId);
      if(cancelErr){
        msgEl.textContent = '発注は完了しましたが、古い発注の取消に失敗しました：' + cancelErr.message;
        return;
      }
      await logChange('stock_orders', existingOrderId, 'is_canceled', false, true, r_now?.category, currentUser.name, r_now?.delivery_date, r_now ? sizeText(r_now) : null);
    }
  }

  const newStatus = (modeLabel === '数量' && totalQty && cumulativeQty < totalQty) ? '発注可能' : '発注済み・受取待ち';

  const { error: statusErr } = await sbClient
    .from('request_item_dates')
    .update({ status: newStatus })
    .eq('id', orderSheetState.dateRowId);

  if(statusErr){
    msgEl.textContent = '発注は完了しましたが、状態更新に失敗しました：' + statusErr.message;
    return;
  }

  await logChange('request_item_dates', orderSheetState.dateRowId, 'status', null, newStatus, r_now?.category, currentUser.name, r_now?.delivery_date, r_now ? sizeText(r_now) : null);

  document.getElementById('order-sheet-overlay').classList.remove('show');
  await loadMyItems();
}

}

function closeOrderSheet(e){
  if(e && e.target !== e.currentTarget) return;
  document.getElementById('order-sheet-overlay').classList.remove('show');
}

async function loadMyItems(){
  const { data: reqRows, error: reqErr } = await sbClient
    .from('requests')
    .select('id')
    .eq('requester_email', currentUser.email);

  if(reqErr){
    document.getElementById('load-error').style.display = 'block';
    document.getElementById('load-error').textContent = '依頼データの取得に失敗しました：' + reqErr.message;
    return;
  }

  const requestIds = (reqRows || []).map(r => r.id);
  if(!requestIds.length){
    myItems = [];
    renderList();
    return;
  }

  const { data: itemRows, error: itemErr } = await sbClient
    .from('request_items')
    .select('id, request_id, client_name, category, item_name, size_l, size_w, size_h, note_item')
    .in('request_id', requestIds);

  if(itemErr){
    document.getElementById('load-error').style.display = 'block';
    document.getElementById('load-error').textContent = '依頼明細の取得に失敗しました：' + itemErr.message;
    return;
  }

  const itemIds = (itemRows || []).map(r => r.id);
  if(!itemIds.length){
    myItems = [];
    renderList();
    return;
  }

  const { data: dateRows, error: dateErr } = await sbClient
    .from('request_item_dates')
    .select('id, request_item_id, delivery_date, qty, status, canceled_at, is_urgent, pending_changed_at')
    .in('request_item_id', itemIds)
    .order('delivery_date', { ascending: true });

  if(dateErr){
    document.getElementById('load-error').style.display = 'block';
    document.getElementById('load-error').textContent = '納入日データの取得に失敗しました：' + dateErr.message;
    return;
  }

  const itemById = {};
  (itemRows || []).forEach(it => { itemById[it.id] = it; });

  myItems = (dateRows || [])
    .filter(d => {
      if(d.canceled_at) return isTodayJST(d.canceled_at);
      return ['受付済み','作業中','発注可能','発注済み・受取待ち'].includes(d.status);
    })
    .map(d => {
      const parent = itemById[d.request_item_id] || {};
      return {
        id: d.id,
        request_item_id: d.request_item_id,
        delivery_date: d.delivery_date,
        qty: d.qty,
        status: d.status,
        canceled_at: d.canceled_at,
        is_urgent: d.is_urgent,
        client_name: parent.client_name,
        category: parent.category,
        item_name: parent.item_name,
        size_l: parent.size_l,
        size_w: parent.size_w,
        size_h: parent.size_h,
        note_item: parent.note_item
      };
    });

  const orderedIds = myItems.filter(r => r.status === '発注済み・受取待ち').map(r => r.id);
  if(orderedIds.length){
    const deliveredDateIds = await getDeliveredDateIds(orderedIds);
    myItems = myItems.filter(r => !(r.status === '発注済み・受取待ち' && deliveredDateIds.has(r.id)));
  }

  const readyIds = myItems.filter(r => r.status === '発注可能').map(r => r.id);
  if(readyIds.length){
    const { data: stockRows2 } = await sbClient
      .from('stock_items')
      .select('id, request_item_date_id')
      .in('request_item_date_id', readyIds);
    const stockIdToDateId2 = {};
    const stockIds2 = (stockRows2 || []).map(s => { stockIdToDateId2[s.id] = s.request_item_date_id; return s.id; });
    if(stockIds2.length){
      const { data: orderRows2 } = await sbClient
        .from('stock_orders')
        .select('stock_item_id, qty')
        .in('stock_item_id', stockIds2)
        .eq('is_canceled', false)
        .eq('mode', '数量');
      const orderedByDateId = {};
      (orderRows2 || []).forEach(o => {
        const dId = stockIdToDateId2[o.stock_item_id];
        if(dId) orderedByDateId[dId] = (orderedByDateId[dId] || 0) + (o.qty || 0);
      });
      myItems.forEach(r => { if(orderedByDateId[r.id]) r.ordered_qty = orderedByDateId[r.id]; });
    }
  }

  document.getElementById('load-error').style.display = 'none';
  renderList();
}

async function getDeliveredDateIds(dateIds){
  const deliveredSet = new Set();
  if(!dateIds.length) return deliveredSet;

  const { data: settings } = await sbClient
    .from('business_settings')
    .select('lock_end_time')
    .limit(1)
    .maybeSingle();

  if(!settings || !settings.lock_end_time) return deliveredSet;

  const now = new Date();
  const nowStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':00';
  const pastLockRelease = nowStr >= settings.lock_end_time;
  if(!pastLockRelease) return deliveredSet;

  const { data: stockRows } = await sbClient
    .from('stock_items')
    .select('request_item_date_id, delivery_marks')
    .in('request_item_date_id', dateIds);

  (stockRows || []).forEach(s => {
    const mark = (s.delivery_marks || {}).individual || '';
    if(mark === 'delivered' && s.request_item_date_id) deliveredSet.add(s.request_item_date_id);
  });

  return deliveredSet;
}

function icon(name){
  const paths = {
    home: '<path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 001 1h10a1 1 0 001-1v-9"/>',
    form: '<path d="M4 3h13l4 4v14a1 1 0 01-1 1H4a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M8 9h8M8 13h8M8 17h5"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    stock: '<path d="M3 8l9-4 9 4-9 4-9-4z"/><path d="M3 8v8l9 4 9-4V8M12 12v8"/>',
    user: '<circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-4 4.2-6 7-6s5.8 2 7 6"/>'
  };
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name]}</svg>`;
}

function renderTabbar(){
  document.getElementById('tabbar').innerHTML = `
    <a class="tab" href="home.html">${icon('home')}<div class="tlabel tech-font">HOME</div></a>
    <a class="tab" href="formB_size.html">${icon('form')}<div class="tlabel tech-font">REQUEST</div></a>
    <a class="tab" href="request_calendar.html">${icon('calendar')}<div class="tlabel tech-font">CALENDAR</div></a>
    <a class="tab" href="stock_view.html">${icon('stock')}<div class="tlabel tech-font">STOCK</div></a>
    <a class="tab active" href="mypage.html">${icon('user')}<div class="tlabel tech-font">MYPAGE</div></a>`;
}

async function loginWithGoogle(){
  const { error } = await sbClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href }
  });
  if(error){
    document.getElementById('auth-msg').textContent = 'ログインに失敗しました：' + error.message;
  }
}

async function initAuth(){
  const { data: { user } } = await sbClient.auth.getUser();

  if(!user){
    document.getElementById('auth-loading').style.display='none';
    document.getElementById('auth-login').style.display='block';
    return;
  }

  const { data: allowRow, error: allowErr } = await sbClient
    .from('users_allowlist')
    .select('name, role')
    .eq('email', user.email)
    .maybeSingle();

  if(allowErr || !allowRow || !allowRow.name){
    document.getElementById('auth-loading').style.display='none';
    document.getElementById('auth-denied').style.display='block';
    return;
  }

  currentUser.email = user.email;
  currentUser.name = allowRow.name;

  document.getElementById('login-name-display').textContent = currentUser.name;
  document.getElementById('auth-loading').style.display='none';
  document.getElementById('app-content').style.display='block';

  renderTabbar();
  await loadLockSettings();
  await loadMyItems();
  subscribeRealtime();
}

let realtimeReloadPending = false;

function isSheetOpen(){
  const overlay = document.getElementById('sheet-overlay');
  const orderOverlay = document.getElementById('order-sheet-overlay');
  return (overlay && overlay.classList.contains('show')) || (orderOverlay && orderOverlay.classList.contains('show'));
}

function requestMyItemsReload(){
  if(isSheetOpen()){
    realtimeReloadPending = true;
    return;
  }
  loadMyItems();
}

function subscribeRealtime(){
  sbClient
    .channel('mypage_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'request_item_dates' }, requestMyItemsReload)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'stock_items' }, requestMyItemsReload)
    .subscribe();

  setInterval(() => {
    if(realtimeReloadPending && !isSheetOpen()){
      realtimeReloadPending = false;
      loadMyItems();
    }
  }, 1500);

  setInterval(async () => {
    if(isSheetOpen()) return;
    await loadLockSettings();
  }, 60000);
}

initAuth();
</script>
