<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マイページ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Meiryo','Yu Gothic',sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
.container{max-width:720px;margin:24px auto;padding:0 12px 40px}
h1{font-size:18px;font-weight:bold;color:#1a3a5c;border-bottom:2px solid #1a3a5c;padding-bottom:8px;margin-bottom:20px}

.login-box{max-width:360px;margin:80px auto;text-align:center}
.login-box h1{border:none;margin-bottom:20px}
.btn-google{padding:13px 24px;background:#1a3a5c;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:bold;cursor:pointer}
.btn-google:hover{background:#2c5282}
#auth-loading{text-align:center;padding:60px 0;color:#666;font-size:14px}
.login-name-bar{font-size:12px;color:#555;background:#eef3f8;padding:8px 12px;border-radius:6px;margin-bottom:14px}

.section-title{font-size:14px;font-weight:bold;color:#1a3a5c;margin:20px 0 10px}
.section-title:first-of-type{margin-top:0}
.section-count{font-size:12px;color:#888;font-weight:normal;margin-left:4px}

.item-card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.1);padding:14px 16px;margin-bottom:8px;cursor:pointer}
.item-card .top-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item-card .cat-name{font-size:14px;font-weight:bold;color:#1a3a5c}
.item-card .size-line{font-size:12px;color:#666;margin-top:3px}
.status-badge{font-size:11px;font-weight:bold;padding:3px 9px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.status-badge.受付済み{background:#eef3f8;color:#1a3a5c}
.status-badge.作業中{background:#fff3cd;color:#856404}
.status-badge.発注可能{background:#d4edda;color:#276749}
.status-badge.取消済み{background:#f1e9e7;color:#9c7a72}

.item-card.is-cancelled{cursor:default;opacity:.8}
.item-card.is-cancelled .cat-name{text-decoration:line-through;color:#999}

.empty-msg{text-align:center;color:#999;font-size:13px;padding:24px 0}
#load-error{text-align:center;color:#c53030;font-size:13px;padding:20px 0}

/* 詳細ボトムシート */
.sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50}
.sheet-overlay.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:14px 14px 0 0;padding:20px;max-width:720px;margin:0 auto;z-index:51;max-height:80vh;overflow-y:auto}
.sheet h2{font-size:16px;color:#1a3a5c;margin-bottom:14px}
.sheet .detail-line{font-size:13px;color:#444;margin-bottom:8px}
.sheet .detail-line b{color:#1a3a5c;display:inline-block;min-width:80px}
.btn-close-sheet{width:100%;padding:10px;background:#fff;border:1px solid #999;color:#555;border-radius:6px;font-size:14px;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<div class="container">

<div id="auth-loading">読み込み中...</div>

<div id="auth-login" class="login-box" style="display:none">
  <h1>📋 マイページ</h1>
  <button class="btn-google" onclick="loginWithGoogle()">Googleでログイン</button>
  <div id="auth-msg" style="margin-top:14px;font-size:13px;color:#c53030"></div>
</div>

<div id="auth-denied" class="login-box" style="display:none">
  <h1>📋 マイページ</h1>
  <p style="font-size:14px;color:#c53030">このアカウントはまだ利用登録されていません。管理者に連絡してください。</p>
</div>

<div id="app-content" style="display:none">
  <h1>📋 マイページ</h1>
  <div class="login-name-bar">ログイン中：<span id="login-name-display"></span> さん</div>

  <div class="section-title">発注が必要<span class="section-count" id="count-order"></span></div>
  <div id="list-order"></div>

  <div class="section-title">受付済み（進行中含む）<span class="section-count" id="count-progress"></span></div>
  <div id="list-progress"></div>

  <div id="load-error" style="display:none"></div>
</div>

</div>

<!-- 詳細ボトムシート -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <h2 id="sheet-title"></h2>
    <div id="sheet-detail"></div>
    <div id="sheet-cancel-msg" style="font-size:12px;color:#c53030;margin-top:8px"></div>
    <button class="btn-close-sheet" id="sheet-cancel-btn" style="background:#fff;border:1.5px solid #c53030;color:#c53030;display:none" onclick="cancelFromDetailSheet()">この納入日の依頼を取り消す</button>
    <button class="btn-close-sheet" onclick="closeSheet()">閉じる</button>
  </div>
</div>

<!-- 発注設定ボトムシート（完成品タップ時） -->
<div class="sheet-overlay" id="order-sheet-overlay" onclick="closeOrderSheet(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <h2 id="order-sheet-title"></h2>
    <div id="order-sheet-detail" style="font-size:12px;color:#666;margin-bottom:14px"></div>

    <div id="order-mode-row" style="display:flex;gap:8px;margin-bottom:12px">
      <label style="flex:1;text-align:center;padding:10px 4px;border:1px solid #ccc;border-radius:6px;cursor:pointer" id="order-mode-lbl-circle">
        <input type="radio" name="order-mode" value="circle" checked style="display:none" onchange="onOrderModeChange()">○
      </label>
      <label style="flex:1;text-align:center;padding:10px 4px;border:1px solid #ccc;border-radius:6px;cursor:pointer" id="order-mode-lbl-qty">
        <input type="radio" name="order-mode" value="qty" style="display:none" onchange="onOrderModeChange()">数量
      </label>
      <label style="flex:1;text-align:center;padding:10px 4px;border:1px solid #ccc;border-radius:6px;cursor:pointer" id="order-mode-lbl-date">
        <input type="radio" name="order-mode" value="date" style="display:none" onchange="onOrderModeChange()">日付
      </label>
    </div>

    <div id="order-qty-group" style="display:none;margin-bottom:12px">
      <label style="font-size:12px;color:#555">数量</label>
      <input type="number" id="order-qty-input" min="1" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px">
    </div>
    <div id="order-date-group" style="display:none;margin-bottom:12px">
      <label style="font-size:12px;color:#555">希望日</label>
      <input type="date" id="order-date-input" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px">
    </div>

    <div id="order-sheet-msg" style="font-size:12px;color:#c53030;margin-bottom:8px"></div>

    <button class="btn-close-sheet" id="order-confirm-btn" style="background:#1a3a5c;color:#fff;border:none" onclick="submitOrderFromMypage()">この内容で発注する</button>
    <button class="btn-close-sheet" style="background:#fff;border:1.5px solid #c53030;color:#c53030;margin-top:8px" onclick="cancelRequestItem()">この納入日の依頼を取り消す</button>
    <button class="btn-close-sheet" onclick="closeOrderSheet()">閉じる</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://tguqfgdodevwowydkrkq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OH2iHpq9DIukdzNMUR0lyw_sfVyATp6';
const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = { email: '', name: '' };
// myItems の1件 = 「納入日1件」のカード。親の request_items 情報(カテゴリ・サイズ等)を合成して持つ。
let myItems = [];

function escapeHtml(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function sizeText(row){
  return [row.size_l, row.size_w, row.size_h].filter(v=>v!=null).join('×');
}

// JST基準で「今日」かどうかを判定
function isTodayJST(isoString){
  if(!isoString) return false;
  const fmt = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Tokyo', year:'numeric', month:'2-digit', day:'2-digit' });
  return fmt.format(new Date(isoString)) === fmt.format(new Date());
}

function renderCard(row){
  const cancelled = !!row.canceled_at;
  const dateText = `${row.delivery_date}（${row.qty}c/s）`;
  const clickFn = (row.status === '発注可能' && !cancelled) ? `openOrderSheet('${row.id}')` : `openSheet('${row.id}')`;
  const badgeLabel = cancelled ? '取消済み' : row.status;
  return `
    <div class="item-card${cancelled ? ' is-cancelled' : ''}" onclick="${clickFn}">
      <div class="top-row">
        <div>
          <div class="cat-name">${escapeHtml(row.category)}</div>
          <div class="size-line">${escapeHtml(sizeText(row))}　納入日：${escapeHtml(dateText)}</div>
        </div>
        <span class="status-badge ${cancelled ? '取消済み' : escapeHtml(row.status)}">${escapeHtml(badgeLabel)}</span>
      </div>
    </div>`;
}

function renderList(){
  const orderRows = myItems.filter(r => r.status === '発注可能' && !r.canceled_at);
  const progressRows = myItems.filter(r => (r.status === '受付済み' || r.status === '作業中') && !r.canceled_at);
  const cancelledTodayRows = myItems.filter(r => r.canceled_at);
  const progressListAll = [...progressRows, ...cancelledTodayRows];

  document.getElementById('count-order').textContent = orderRows.length ? `（${orderRows.length}件）` : '';
  document.getElementById('count-progress').textContent = progressListAll.length ? `（${progressListAll.length}件）` : '';

  document.getElementById('list-order').innerHTML = orderRows.length
    ? orderRows.map(renderCard).join('')
    : '<div class="empty-msg">現在、発注が必要な依頼はありません</div>';

  document.getElementById('list-progress').innerHTML = progressListAll.length
    ? progressListAll.map(renderCard).join('')
    : '<div class="empty-msg">現在、受付済みの依頼はありません</div>';
}

function openSheet(dateRowId){
  const row = myItems.find(r => r.id === dateRowId);
  if(!row) return;

  document.getElementById('sheet-title').textContent = row.category;

  document.getElementById('sheet-detail').innerHTML = `
    <div class="detail-line"><b>サイズ</b>${escapeHtml(sizeText(row))}</div>
    <div class="detail-line"><b>納入日</b>${escapeHtml(row.delivery_date)}（${escapeHtml(String(row.qty))}c/s）</div>
    <div class="detail-line"><b>ステータス</b>${row.canceled_at ? '取消済み' : escapeHtml(row.status)}</div>
    ${row.client_name ? `<div class="detail-line"><b>客先名</b>${escapeHtml(row.client_name)}</div>` : ''}
    ${row.note_item ? `<div class="detail-line"><b>備考</b>${escapeHtml(row.note_item)}</div>` : ''}
  `;

  const cancelBtn = document.getElementById('sheet-cancel-btn');
  const cancelMsg = document.getElementById('sheet-cancel-msg');
  cancelMsg.textContent = row.canceled_at ? '本日中のみ表示されます（日付が変わると一覧から消えます）' : '';
  if(!row.canceled_at && (row.status === '受付済み' || row.status === '作業中')){
    cancelBtn.style.display = 'block';
    cancelBtn.dataset.dateRowId = dateRowId;
  } else {
    cancelBtn.style.display = 'none';
  }

  document.getElementById('sheet-overlay').classList.add('show');
}

async function cancelFromDetailSheet(){
  const dateRowId = document.getElementById('sheet-cancel-btn').dataset.dateRowId;
  if(!dateRowId) return;
  if(!confirm('この納入日の依頼を取り消しますか？取消後も本日中は依頼一覧に取消線付きで表示されます。')) return;

  const { error } = await sbClient
    .from('request_item_dates')
    .update({ canceled_at: new Date().toISOString() })
    .eq('id', dateRowId);

  if(error){
    document.getElementById('sheet-cancel-msg').textContent = '取消に失敗しました：' + error.message;
    return;
  }

  document.getElementById('sheet-overlay').classList.remove('show');
  await loadMyItems();
}

function closeSheet(e){
  if(e && e.target !== e.currentTarget) return;
  document.getElementById('sheet-overlay').classList.remove('show');
}

// =============================================
// 発注可能（完成）タップ時：発注設定シート（○/数量/日付）を開く
// 在庫は request_item_date_id 単位で紐づく
// =============================================
let orderSheetState = { dateRowId: null, stockItemId: null };

async function openOrderSheet(dateRowId){
  const row = myItems.find(r => r.id === dateRowId);
  if(!row) return;

  const { data: stockRow, error } = await sbClient
    .from('stock_items')
    .select('id')
    .eq('request_item_date_id', dateRowId)
    .maybeSingle();

  if(error || !stockRow){
    alert('在庫データが見つかりませんでした。時間をおいて再度お試しください。');
    return;
  }

  orderSheetState.dateRowId = dateRowId;
  orderSheetState.stockItemId = stockRow.id;

  document.getElementById('order-sheet-title').textContent = row.category;
  document.getElementById('order-sheet-detail').textContent = `${sizeText(row)}／納入日：${row.delivery_date}（${row.qty}c/s）`;

  document.querySelector('input[name="order-mode"][value="circle"]').checked = true;
  document.getElementById('order-qty-input').value = '';
  document.getElementById('order-date-input').value = '';
  document.getElementById('order-sheet-msg').textContent = '';
  onOrderModeChange();

  document.getElementById('order-sheet-overlay').classList.add('show');
}

function onOrderModeChange(){
  const mode = document.querySelector('input[name="order-mode"]:checked').value;
  ['circle','qty','date'].forEach(k => {
    document.getElementById(`order-mode-lbl-${k}`).style.background = (k === mode) ? '#dbeafe' : '';
    document.getElementById(`order-mode-lbl-${k}`).style.borderColor = (k === mode) ? '#2c5282' : '#ccc';
  });
  document.getElementById('order-qty-group').style.display = (mode === 'qty') ? 'block' : 'none';
  document.getElementById('order-date-group').style.display = (mode === 'date') ? 'block' : 'none';
}

async function submitOrderFromMypage(){
  const mode = document.querySelector('input[name="order-mode"]:checked').value;
  const msgEl = document.getElementById('order-sheet-msg');
  msgEl.textContent = '';

  let qty = null, desiredDate = null;
  if(mode === 'qty'){
    qty = parseInt(document.getElementById('order-qty-input').value, 10);
    if(!qty || qty < 1){ msgEl.textContent = '数量を入力してください。'; return; }
  }
  if(mode === 'date'){
    desiredDate = document.getElementById('order-date-input').value;
    if(!desiredDate){ msgEl.textContent = '希望日を入力してください。'; return; }
  }

  const modeLabel = mode === 'circle' ? '○' : (mode === 'qty' ? '数量' : '日付');

  const { error: orderErr } = await sbClient.from('stock_orders').insert({
    stock_item_id: orderSheetState.stockItemId,
    operated_by_email: currentUser.email,
    operated_by_name: currentUser.name,
    destination: null,
    mode: modeLabel,
    qty: qty,
    desired_date: desiredDate,
    is_proxy: false,
    is_canceled: false
  });

  if(orderErr){
    msgEl.textContent = '発注に失敗しました：' + orderErr.message;
    return;
  }

  const { error: statusErr } = await sbClient
    .from('request_item_dates')
    .update({ status: '発注済み・受取待ち' })
    .eq('id', orderSheetState.dateRowId);

  if(statusErr){
    msgEl.textContent = '発注は完了しましたが、状態更新に失敗しました：' + statusErr.message;
    return;
  }

  document.getElementById('order-sheet-overlay').classList.remove('show');
  await loadMyItems();
}

async function cancelRequestItem(){
  if(!confirm('この納入日の依頼を取り消しますか？取消後も本日中は依頼一覧に取消線付きで表示されます。')) return;

  const { error } = await sbClient
    .from('request_item_dates')
    .update({ canceled_at: new Date().toISOString() })
    .eq('id', orderSheetState.dateRowId);

  if(error){
    document.getElementById('order-sheet-msg').textContent = '取消に失敗しました：' + error.message;
    return;
  }

  document.getElementById('order-sheet-overlay').classList.remove('show');
  await loadMyItems();
}

function closeOrderSheet(e){
  if(e && e.target !== e.currentTarget) return;
  document.getElementById('order-sheet-overlay').classList.remove('show');
}

// =============================================
// データ読み込み：自分のrequestsに紐づくrequest_items（カテゴリ・サイズ等）と、
// それぞれに紐づくrequest_item_dates（納入日ごとの状態・数量）を合成して
// 「納入日1件=1カード」のリストを作る
// =============================================
async function loadMyItems(){
  const { data: reqRows, error: reqErr } = await sbClient
    .from('requests')
    .select('id')
    .eq('requester_email', currentUser.email);

  if(reqErr){
    document.getElementById('load-error').style.display = 'block';
    document.getElementById('load-error').textContent = '依頼データの取得に失敗しました：' + reqErr.message;
    return;
  }

  const requestIds = (reqRows || []).map(r => r.id);
  if(!requestIds.length){
    myItems = [];
    renderList();
    return;
  }

  const { data: itemRows, error: itemErr } = await sbClient
    .from('request_items')
    .select('id, request_id, client_name, category, size_l, size_w, size_h, note_item')
    .in('request_id', requestIds);

  if(itemErr){
    document.getElementById('load-error').style.display = 'block';
    document.getElementById('load-error').textContent = '依頼明細の取得に失敗しました：' + itemErr.message;
    return;
  }

  const itemIds = (itemRows || []).map(r => r.id);
  if(!itemIds.length){
    myItems = [];
    renderList();
    return;
  }

  const { data: dateRows, error: dateErr } = await sbClient
    .from('request_item_dates')
    .select('id, request_item_id, delivery_date, qty, status, canceled_at')
    .in('request_item_id', itemIds)
    .order('delivery_date', { ascending: true });

  if(dateErr){
    document.getElementById('load-error').style.display = 'block';
    document.getElementById('load-error').textContent = '納入日データの取得に失敗しました：' + dateErr.message;
    return;
  }

  const itemById = {};
  (itemRows || []).forEach(it => { itemById[it.id] = it; });

  // 表示対象：ステータスが受付済み/作業中/発注可能で未取消、または本日取消したもの
  myItems = (dateRows || [])
    .filter(d => {
      if(d.canceled_at) return isTodayJST(d.canceled_at);
      return ['受付済み','作業中','発注可能'].includes(d.status);
    })
    .map(d => {
      const parent = itemById[d.request_item_id] || {};
      return {
        id: d.id,
        request_item_id: d.request_item_id,
        delivery_date: d.delivery_date,
        qty: d.qty,
        status: d.status,
        canceled_at: d.canceled_at,
        client_name: parent.client_name,
        category: parent.category,
        size_l: parent.size_l,
        size_w: parent.size_w,
        size_h: parent.size_h,
        note_item: parent.note_item
      };
    });

  document.getElementById('load-error').style.display = 'none';
  renderList();
}

async function loginWithGoogle(){
  const { error } = await sbClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href }
  });
  if(error){
    document.getElementById('auth-msg').textContent = 'ログインに失敗しました：' + error.message;
  }
}

async function initAuth(){
  const { data: { user } } = await sbClient.auth.getUser();

  if(!user){
    document.getElementById('auth-loading').style.display='none';
    document.getElementById('auth-login').style.display='block';
    return;
  }

  const { data: allowRow, error: allowErr } = await sbClient
    .from('users_allowlist')
    .select('name, role')
    .eq('email', user.email)
    .maybeSingle();

  if(allowErr || !allowRow || !allowRow.name){
    document.getElementById('auth-loading').style.display='none';
    document.getElementById('auth-denied').style.display='block';
    return;
  }

  currentUser.email = user.email;
  currentUser.name = allowRow.name;

  document.getElementById('login-name-display').textContent = currentUser.name;
  document.getElementById('auth-loading').style.display='none';
  document.getElementById('app-content').style.display='block';

  await loadMyItems();
  subscribeRealtime();
}

// =============================================
// Realtime購読：request_item_dates（納入日ごとの状態）の変更を監視する
// =============================================
let realtimeReloadPending = false;

function isSheetOpen(){
  const overlay = document.getElementById('sheet-overlay');
  const orderOverlay = document.getElementById('order-sheet-overlay');
  return (overlay && overlay.classList.contains('show')) || (orderOverlay && orderOverlay.classList.contains('show'));
}

function requestMyItemsReload(){
  if(isSheetOpen()){
    realtimeReloadPending = true;
    return;
  }
  loadMyItems();
}

function subscribeRealtime(){
  sbClient
    .channel('mypage_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'request_item_dates' }, requestMyItemsReload)
    .subscribe((status, err) => {
      console.log('[realtime] channel status:', status, err || '');
    });

  setInterval(() => {
    if(realtimeReloadPending && !isSheetOpen()){
      realtimeReloadPending = false;
      loadMyItems();
    }
  }, 1500);
}

initAuth();
</script>
</body>
</html>
