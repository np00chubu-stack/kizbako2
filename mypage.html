<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マイページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2430; --ink-soft:#6B7480; --ink-faint:#A2A8B3;
  --line:#E4E7EC; --bg-page:#EEF1F5; --white:#FFFFFF;
  --accent:#2A4B8D; --accent-deep:#1E3766; --accent-soft:#E6ECF7;
  --alert:#C4531F; --alert-soft:#FBEAE0;
  --amber:#B98418; --amber-soft:#FAF0DE;
  --ready:#2F7D4F; --ready-soft:#E4F3E8;
  --muted:#8B93A0; --muted-soft:#F0F1F3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(circle at 1px 1px, rgba(42,75,141,0.06) 1px, transparent 0) 0 0/22px 22px,
    var(--bg-page);
  color:var(--ink); font-family:'M PLUS Rounded 1c', sans-serif; min-height:100vh;
}
.mono{ font-family:'JetBrains Mono', monospace; }

.login-box{max-width:360px;margin:80px auto;text-align:center;padding:0 16px}
.login-box h1{font-size:19px;font-weight:800;color:var(--ink);margin-bottom:22px}
.btn-google{padding:13px 26px;background:var(--accent);color:#fff;border:none;border-radius:999px;font-size:14px;font-weight:800;font-family:'M PLUS Rounded 1c',sans-serif;cursor:pointer;box-shadow:0 8px 18px rgba(30,55,102,0.28)}
.btn-google:hover{background:var(--accent-deep)}
#auth-loading{text-align:center;padding:80px 0;color:var(--ink-soft);font-size:14px}
#auth-msg{margin-top:14px;font-size:13px;color:var(--alert)}
.login-box p{font-size:14px;color:var(--alert);line-height:1.6}

.page-wrap{ max-width:820px; margin:0 auto; padding:20px 14px 40px; }
.phone{
  width:100%; max-width:390px; aspect-ratio:375/812; margin:0 auto;
  background:var(--white); border:9px solid #16181B; border-radius:42px;
  box-shadow:0 24px 50px rgba(20,22,26,0.18);
  overflow:hidden; display:flex; flex-direction:column; position:relative;
}
.notch{ position:absolute; top:9px; left:50%; transform:translateX(-50%); width:34%; height:22px; background:#16181B; border-radius:0 0 16px 16px; z-index:5; }

.app-header{ flex:0 0 auto; padding:26px 18px 8px; display:flex; align-items:flex-start; justify-content:space-between; }
.app-header .eyebrow{ font-size:11px; color:var(--ink-faint); font-weight:700; }
.app-header h1{ margin:2px 0 0; font-size:18px; font-weight:800; }
.back-icon{ width:32px; height:32px; border-radius:50%; background:var(--bg-page); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); flex-shrink:0; cursor:pointer; }
.back-icon svg{ width:16px; height:16px; }
.login-name-bar{ font-size:9.5px; color:var(--ink-faint); padding:0 18px 4px; }

.app-content{ flex:1 1 auto; min-height:0; padding:4px 16px 8px; display:flex; flex-direction:column; gap:10px; overflow-y:auto; }

.action-banner{ display:none; flex:0 0 auto; align-items:center; gap:10px; background:linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%); color:#fff; border-radius:16px; padding:12px 14px; box-shadow:0 8px 18px rgba(30,55,102,0.28); }
.action-banner.show{ display:flex; }
.action-banner .ab-icon{ width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.action-banner .ab-icon svg{ width:16px; height:16px; }
.action-banner .ab-title{ font-size:13px; font-weight:800; }
.action-banner .ab-sub{ font-size:10.5px; opacity:.85; margin-top:1px; }

.section-label{ flex:0 0 auto; font-size:10.5px; font-weight:800; color:var(--ink-soft); margin-top:4px; display:flex; align-items:baseline; gap:6px; }
.section-label .sl-count{ font-weight:600; color:var(--ink-faint); font-size:9.5px; }

.req-list{ flex:0 0 auto; display:flex; flex-direction:column; gap:8px; }

.ready-card{ background:var(--accent-soft); border:1.5px solid var(--accent); border-radius:14px; padding:11px 13px; display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; margin-bottom:8px; }
.ready-card:active{ box-shadow:inset 0 0 0 1.5px var(--accent-deep); }
.ready-main .rc-date{ font-size:9.5px; color:var(--accent-deep); font-weight:700; }
.ready-main .rc-name{ font-size:12.5px; font-weight:800; margin-top:1px; }
.ready-main .rc-detail{ font-size:10.5px; color:var(--ink-soft); margin-top:1px; }
.ready-arrow{ flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; }
.ready-arrow svg{ width:13px; height:13px; }

.plain-list{ background:var(--white); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
.plain-row{ display:flex; align-items:center; gap:10px; padding:10px 13px; border-top:1px solid var(--line); cursor:pointer; }
.plain-row:first-child{ border-top:none; }
.plain-row:active{ background:var(--bg-page); }
.plain-row .pr-date{ font-size:9.5px; color:var(--ink-faint); width:34px; flex-shrink:0; }
.plain-row .pr-main{ flex:1; min-width:0; }
.plain-row .pr-name{ font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.plain-row.is-cancelled .pr-name{ text-decoration:line-through; color:var(--ink-faint); }
.plain-row .pr-detail{ font-size:9.5px; color:var(--ink-faint); margin-top:1px; }
.urgent-tag{ font-size:8px; font-weight:800; color:#fff; background:var(--alert); padding:1.5px 5.5px; border-radius:999px; margin-left:4px; }

.status-pill{ flex-shrink:0; display:flex; align-items:center; gap:3px; font-size:9px; font-weight:800; padding:3px 8px; border-radius:999px; white-space:nowrap; }
.status-pill svg{ width:9px; height:9px; }
.status-pill.ok{ background:var(--accent-soft); color:var(--accent-deep); }
.status-pill.wip{ background:var(--amber-soft); color:var(--amber); }
.status-pill.ready{ background:var(--ready-soft); color:var(--ready); }
.status-pill.done{ background:#E7EEF6; color:#3D5A80; }
.status-pill.canceled{ background:var(--muted-soft); color:var(--muted); }

.empty-note{ text-align:center; padding:16px 10px; color:var(--ink-faint); font-size:10.5px; line-height:1.6; }
#load-error{ text-align:center; color:var(--alert); font-size:11px; padding:10px 0; }

.spacer{ flex:1 1 auto; }

.tabbar{ flex:0 0 auto; display:flex; border-top:1px solid var(--line); background:rgba(255,255,255,0.92); padding:7px 4px 13px; }
.tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--ink-faint); text-decoration:none; cursor:pointer; background:none; border:none; font-family:inherit; }
.tab svg{ width:20px; height:20px; }
.tab .tlabel{ font-size:9px; font-weight:700; }
.tab.active{ color:var(--accent-deep); }

/* ---------- ボトムシート ---------- */
.sheet-overlay{ position:absolute; inset:0; background:rgba(20,22,26,0.4); z-index:20; display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .2s ease; }
.sheet-overlay.show{ opacity:1; pointer-events:auto; }
.sheet{ width:100%; background:#fff; border-radius:20px 20px 0 0; padding:10px 20px 22px; max-height:82%; overflow-y:auto; transform:translateY(100%); transition:transform .25s ease; }
.sheet-overlay.show .sheet{ transform:translateY(0); }
.sheet-handle{ width:36px; height:4px; border-radius:2px; background:var(--line); margin:6px auto 14px; }
.sheet-title{ font-size:15px; font-weight:800; }
.sheet-sub{ font-size:10.5px; color:var(--ink-soft); margin-top:3px; }

.sheet-meta{ margin-top:14px; display:flex; flex-direction:column; gap:9px; }
.sheet-meta .mrow{ display:flex; justify-content:space-between; font-size:12px; border-top:1px solid var(--line); padding-top:8px; }
.sheet-meta .mrow:first-child{ border-top:none; padding-top:0; }
.sheet-meta .mk{ color:var(--ink-soft); }
.sheet-meta .mv{ font-weight:700; text-align:right; }

.edit-area{ margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
.edit-area .edit-title{ font-size:10.5px; font-weight:800; color:var(--ink-soft); margin-bottom:8px; }
.edit-area label{ display:block; font-size:11px; color:var(--ink-soft); margin-bottom:3px; }
.edit-area input[type="date"],.edit-area input[type="number"]{ width:100%; padding:10px 11px; border:1.5px solid var(--line); border-radius:12px; font-family:'M PLUS Rounded 1c',sans-serif; font-size:13px; color:var(--ink); margin-bottom:10px; }
.edit-note{ font-size:11px; color:var(--amber); background:var(--amber-soft); border-radius:10px; padding:9px 10px; margin-bottom:10px; line-height:1.5; }

.mode-tabs{ display:flex; gap:6px; margin-top:16px; }
.mode-tab{ flex:1; appearance:none; border:1.5px solid var(--line); background:var(--white); cursor:pointer; border-radius:12px; padding:12px 4px; text-align:center; font-family:'M PLUS Rounded 1c',sans-serif; }
.mode-tab .mt-emoji{ font-size:19px; }
.mode-tab .mt-label{ font-size:10.5px; font-weight:800; margin-top:3px; color:var(--ink); }
.mode-tab.active{ border-color:var(--accent); background:var(--accent-soft); }

.mode-body{ margin-top:16px; min-height:50px; }
.mode-body .mb-desc{ font-size:11px; color:var(--ink-soft); line-height:1.6; margin-bottom:10px; }
.qty-stepper{ display:flex; align-items:center; justify-content:center; gap:16px; }
.qty-stepper button{ width:36px; height:36px; border-radius:50%; border:1.5px solid var(--line); background:#fff; font-size:16px; font-weight:800; color:var(--ink); cursor:pointer; }
.qty-stepper .qs-val{ font-size:22px; font-weight:800; min-width:40px; text-align:center; }
.date-input{ width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:12px; font-family:'M PLUS Rounded 1c', sans-serif; font-size:13px; color:var(--ink); }

.sheet-confirm{ width:100%; margin-top:18px; appearance:none; border:none; cursor:pointer; background:var(--accent); color:#fff; font-family:'M PLUS Rounded 1c', sans-serif; font-weight:800; font-size:13.5px; padding:13px 0; border-radius:12px; }
.sheet-cancel-link{ width:100%; margin-top:10px; appearance:none; cursor:pointer; background:#fff; border:1.5px solid var(--alert); color:var(--alert); font-family:'M PLUS Rounded 1c', sans-serif; font-weight:800; font-size:12px; padding:10px 0; border-radius:12px; }
.sheet-close{ width:100%; margin-top:8px; appearance:none; border:none; cursor:pointer; background:none; color:var(--ink-faint); font-family:'M PLUS Rounded 1c', sans-serif; font-weight:700; font-size:11.5px; padding:6px 0; }
.sheet-note{ margin-top:10px; font-size:10.5px; color:var(--alert); text-align:center; line-height:1.6; }
</style>
</head>
<body>

<div id="auth-loading" class="login-box" style="margin-top:80px"><div style="color:#6B7480;font-size:14px">読み込み中...</div></div>

<div id="auth-login" class="login-box" style="display:none">
  <h1>マイページ</h1>
  <button class="btn-google" onclick="loginWithGoogle()">Googleでログイン</button>
  <div id="auth-msg"></div>
</div>

<div id="auth-denied" class="login-box" style="display:none">
  <h1>マイページ</h1>
  <p>このアカウントはまだ利用登録されていません。管理者に連絡してください。</p>
</div>

<div id="app-content" class="page-wrap" style="display:none">
  <div class="phone" id="phoneFrame">
    <div class="notch"></div>
    <div class="app-header">
      <div>
        <div class="eyebrow">依頼管理システム</div>
        <h1>マイページ</h1>
      </div>
      <a class="back-icon" href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      </a>
    </div>
    <div class="login-name-bar">ログイン中：<span id="login-name-display"></span> さん</div>

    <div class="app-content">
      <div class="action-banner" id="action-banner">
        <div class="ab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
        <div>
          <div class="ab-title" id="ab-title"></div>
          <div class="ab-sub">タップして発注してください</div>
        </div>
      </div>

      <div class="section-label">完成品<span class="sl-count" id="count-ready"></span></div>
      <div class="req-list" id="list-ready"></div>

      <div class="section-label">依頼一覧<span class="sl-count" id="count-all"></span></div>
      <div id="list-all"></div>

      <div id="load-error" style="display:none"></div>
      <div class="spacer"></div>
    </div>

    <div class="tabbar" id="tabbar"></div>

    <!-- 詳細ボトムシート -->
    <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet(event)">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <div class="sheet-title" id="sheet-title"></div>
        <div class="sheet-meta" id="sheet-detail"></div>
        <div id="sheet-edit-area"></div>
        <div class="sheet-note" id="sheet-cancel-msg"></div>
        <button class="sheet-cancel-link" id="sheet-cancel-btn" style="display:none" onclick="cancelFromDetailSheet()">この納入日の依頼を取り消す</button>
        <button class="sheet-close" onclick="closeSheet()">閉じる</button>
      </div>
    </div>

    <!-- 発注設定ボトムシート -->
    <div class="sheet-overlay" id="order-sheet-overlay" onclick="closeOrderSheet(event)">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <div class="sheet-title" id="order-sheet-title"></div>
        <div class="sheet-sub" id="order-sheet-detail"></div>

        <div class="mode-tabs" id="orderModeTabs">
          <button type="button" class="mode-tab" data-mode="circle"><div class="mt-emoji">○</div><div class="mt-label">完成次第</div></button>
          <button type="button" class="mode-tab" data-mode="qty"><div class="mt-emoji">#</div><div class="mt-label">数量指定</div></button>
          <button type="button" class="mode-tab" data-mode="date"><div class="mt-emoji">📅</div><div class="mt-label">日付指定</div></button>
        </div>
        <div class="mode-body" id="orderModeBody"></div>

        <div class="sheet-note" id="order-sheet-msg"></div>

        <button class="sheet-confirm" id="order-confirm-btn" onclick="submitOrderFromMypage()">この内容で発注する</button>
        <button class="sheet-cancel-link" onclick="cancelRequestItem()">この納入日の依頼を取り消す</button>
        <button class="sheet-close" onclick="closeOrderSheet()">閉じる</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://tguqfgdodevwowydkrkq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OH2iHpq9DIukdzNMUR0lyw_sfVyATp6';
const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = { email: '', name: '' };

async function logChange(tableName, recordId, fieldName, oldValue, newValue, itemLabel){
  await sbClient.from('change_history').insert({
    table_name: tableName,
    record_id: recordId,
    field_name: fieldName,
    old_value: oldValue === null || oldValue === undefined ? null : String(oldValue),
    new_value: newValue === null || newValue === undefined ? null : String(newValue),
    item_label: itemLabel || null,
    changed_by_name: currentUser.name,
    changed_by_email: currentUser.email
  });
}
// myItems の1件 = 「納入日1件」のカード。親の request_items 情報(カテゴリ・サイズ等)を合成して持つ。
let myItems = [];

function escapeHtml(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function sizeText(row){
  return [row.size_l, row.size_w, row.size_h].filter(v=>v!=null).join('×');
}

// JST基準で「今日」かどうかを判定
function isTodayJST(isoString){
  if(!isoString) return false;
  const fmt = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Tokyo', year:'numeric', month:'2-digit', day:'2-digit' });
  return fmt.format(new Date(isoString)) === fmt.format(new Date());
}

function shortDate(ymd){
  const m = String(ymd).match(/^\d{4}-(\d{1,2})-(\d{1,2})/);
  return m ? `${parseInt(m[1],10)}/${parseInt(m[2],10)}` : ymd;
}

function statusClass(label){
  if(label === '取消済み') return 'canceled';
  if(label === '発注済み') return 'done';
  if(label === '受付済み') return 'ok';
  if(label === '作業中') return 'wip';
  if(label === '発注可能') return 'ready';
  return 'ok';
}
function statusIcon(cls){
  if(cls === 'wip') return '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>';
  if(cls === 'canceled') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 12h12"/></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
}

// =============================================
// 完成品カード(発注可能・未取消)
// =============================================
function renderReadyCard(row){
  const urgentTag = row.is_urgent ? '<span class="urgent-tag">急ぎ</span>' : '';
  return `
    <div class="ready-card" onclick="openOrderSheet('${row.id}')">
      <div class="ready-main">
        <div class="rc-date mono">希望日 ${escapeHtml(shortDate(row.delivery_date))}</div>
        <div class="rc-name">${escapeHtml(row.category)}${urgentTag}</div>
        <div class="rc-detail">${escapeHtml(sizeText(row))}　${escapeHtml(String(row.qty))}c/s</div>
      </div>
      <div class="ready-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
    </div>`;
}

// =============================================
// 依頼一覧行(確認専用)
// =============================================
function renderListRow(row){
  const cancelled = !!row.canceled_at;
  const isOrdered = row.status === '発注済み・受取待ち';
  const label = cancelled ? '取消済み' : (isOrdered ? '発注済み' : row.status);
  const cls = statusClass(label);
  const urgentTag = row.is_urgent ? '<span class="urgent-tag">急ぎ</span>' : '';
  return `
    <div class="plain-row${cancelled ? ' is-cancelled' : ''}" onclick="openSheet('${row.id}')">
      <div class="pr-date mono">${escapeHtml(shortDate(row.delivery_date))}</div>
      <div class="pr-main">
        <div class="pr-name">${escapeHtml(row.category)}${urgentTag}</div>
        <div class="pr-detail">${escapeHtml(sizeText(row))}　${escapeHtml(String(row.qty))}c/s</div>
      </div>
      <span class="status-pill ${cls}">${statusIcon(cls)}<span>${escapeHtml(label)}</span></span>
    </div>`;
}

function renderList(){
  const readyRows = myItems.filter(r => r.status === '発注可能' && !r.canceled_at);
  const listRows = myItems
    .filter(r => (r.status === '受付済み' || r.status === '作業中' || r.status === '発注済み・受取待ち' || r.canceled_at))
    .sort((a,b) => a.delivery_date.localeCompare(b.delivery_date));

  const banner = document.getElementById('action-banner');
  if(readyRows.length){
    banner.classList.add('show');
    document.getElementById('ab-title').textContent = `${readyRows.length}件の完成品があります`;
  } else {
    banner.classList.remove('show');
  }

  document.getElementById('count-ready').textContent = readyRows.length ? `(${readyRows.length}件)` : '';
  document.getElementById('count-all').textContent = listRows.length ? `(${listRows.length}件)` : '';

  document.getElementById('list-ready').innerHTML = readyRows.length
    ? readyRows.map(renderReadyCard).join('')
    : '<div class="empty-note">現在、完成品はありません</div>';

  document.getElementById('list-all').innerHTML = listRows.length
    ? `<div class="plain-list">${listRows.map(renderListRow).join('')}</div>`
    : '<div class="plain-list"><div class="empty-note">依頼中のものはありません</div></div>';
}

// =============================================
// 日程・数量変更欄(受付済み：日程＋数量／作業中：日程のみ、数量は管理者連絡案内)
// 中3日ルールはこの変更には適用しない
// =============================================
function renderEditArea(row){
  if(row.canceled_at) return '';
  if(row.status !== '受付済み' && row.status !== '作業中') return '';

  const qtyFieldHtml = row.status === '受付済み'
    ? `<label>数量(c/s)</label><input type="number" id="edit-qty-input" min="1" value="${row.qty}">`
    : `<div class="edit-note">数量の変更は管理者へご連絡ください（作業に取りかかっているため）</div>`;

  return `
    <div class="edit-area">
      <div class="edit-title">日程・数量の変更</div>
      <label>納入日</label>
      <input type="date" id="edit-date-input" value="${row.delivery_date}">
      ${qtyFieldHtml}
      <button class="sheet-confirm" style="margin-top:2px" onclick="saveEditChanges('${row.id}')">この内容で変更する</button>
      <div class="sheet-note" id="sheet-edit-msg"></div>
    </div>`;

async function saveEditChanges(dateRowId){
  const row = myItems.find(r => r.id === dateRowId);
  if(!row) return;

  const dateInput = document.getElementById('edit-date-input');
  const newDate = dateInput ? dateInput.value : '';
  const msgEl = document.getElementById('sheet-edit-msg');

  if(!newDate){ msgEl.textContent = '納入日を入力してください。'; return; }

  const payload = {
    delivery_date: newDate,
    last_changed_by: currentUser.name,
    last_changed_at: new Date().toISOString()
  };

  if(row.status === '受付済み'){
    const qtyInput = document.getElementById('edit-qty-input');
    const newQty = qtyInput ? parseInt(qtyInput.value, 10) : NaN;
    if(!newQty || newQty < 1){ msgEl.textContent = '数量を入力してください。'; return; }
    payload.qty = newQty;
  }

  const { error } = await sbClient
    .from('request_item_dates')
    .update(payload)
    .eq('id', dateRowId);

  if(error){
    msgEl.textContent = '変更に失敗しました：' + error.message;
    return;
  }

  document.getElementById('sheet-overlay').classList.remove('show');
  await loadMyItems();
}

function openSheet(dateRowId){
  const row = myItems.find(r => r.id === dateRowId);
  if(!row) return;

  document.getElementById('sheet-title').textContent = row.category;

  const statusLabel = row.canceled_at ? '取消済み' : (row.status === '発注済み・受取待ち' ? '発注済み' : row.status);

  document.getElementById('sheet-detail').innerHTML = `
    <div class="mrow"><span class="mk">サイズ</span><span class="mv">${escapeHtml(sizeText(row))}</span></div>
    <div class="mrow"><span class="mk">納入日</span><span class="mv mono">${escapeHtml(row.delivery_date)}（${escapeHtml(String(row.qty))}c/s）</span></div>
    <div class="mrow"><span class="mk">ステータス</span><span class="mv">${escapeHtml(statusLabel)}</span></div>
    ${row.client_name ? `<div class="mrow"><span class="mk">客先名</span><span class="mv">${escapeHtml(row.client_name)}</span></div>` : ''}
    ${row.note_item ? `<div class="mrow"><span class="mk">備考</span><span class="mv">${escapeHtml(row.note_item)}</span></div>` : ''}
  `;

  document.getElementById('sheet-edit-area').innerHTML = renderEditArea(row);

  const cancelBtn = document.getElementById('sheet-cancel-btn');
  const cancelMsg = document.getElementById('sheet-cancel-msg');
  cancelMsg.textContent = row.canceled_at ? '本日中のみ表示されます（日付が変わると一覧から消えます）' : '';

}

// =============================================
// 発注可能（完成）タップ時：発注設定シート（○/数量/日付）を開く
// 在庫は request_item_date_id 単位で紐づく
// =============================================
let orderSheetState = { dateRowId: null, stockItemId: null, mode: 'circle', qty: 1, date: '' };

async function openOrderSheet(dateRowId){
  const row = myItems.find(r => r.id === dateRowId);
  if(!row) return;

  const { data: stockRow, error } = await sbClient
    .from('stock_items')
    .select('id')
    .eq('request_item_date_id', dateRowId)
    .maybeSingle();

  if(error || !stockRow){
    alert('在庫データが見つかりませんでした。時間をおいて再度お試しください。');
    return;
  }

  orderSheetState = { dateRowId, stockItemId: stockRow.id, mode: 'circle', qty: 1, date: '' };

  document.getElementById('order-sheet-detail').textContent = `${sizeText(row)}／納入日：${row.delivery_date}（${row.qty}c/s）`;

  renderOrderModeTabs();
  renderOrderModeBody();

  document.getElementById('order-sheet-overlay').classList.add('show');
}

function renderOrderModeTabs(){
  document.querySelectorAll('#orderModeTabs .mode-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.mode === orderSheetState.mode);
    el.onclick = () => { orderSheetState.mode = el.dataset.mode; renderOrderModeTabs(); renderOrderModeBody(); };
  });
}

function renderOrderModeBody(){
  const body = document.getElementById('orderModeBody');
  if(orderSheetState.mode === 'circle'){
    body.innerHTML = `<div class="mb-desc">完成次第、すぐ受け取りたい場合はこちらを選びます。</div>`;
  } else if(orderSheetState.mode === 'qty'){
    body.innerHTML = `
      <div class="mb-desc">今回はこの数だけ欲しい場合に指定します(部分発注)。</div>
      <div class="qty-stepper">
        <button type="button" id="orderQtyMinus">−</button>
        <div class="qs-val" id="orderQtyVal">${orderSheetState.qty}</div>
        <button type="button" id="orderQtyPlus">＋</button>
      </div>`;
    document.getElementById('orderQtyMinus').onclick = () => { if(orderSheetState.qty > 1) orderSheetState.qty--; document.getElementById('orderQtyVal').textContent = orderSheetState.qty; };
    document.getElementById('orderQtyPlus').onclick = () => { orderSheetState.qty++; document.getElementById('orderQtyVal').textContent = orderSheetState.qty; };
  } else if(orderSheetState.mode === 'date'){
    body.innerHTML = `
      <div class="mb-desc">受け取りたい日を指定できます。</div>
      <input type="date" class="date-input" id="orderDateInput" value="${orderSheetState.date}">`;
    document.getElementById('orderDateInput').oninput = (e) => { orderSheetState.date = e.target.value; };
  }
}

async function submitOrderFromMypage(){
  const mode = orderSheetState.mode;
  const msgEl = document.getElementById('order-sheet-msg');
  msgEl.textContent = '';

  let qty = null, desiredDate = null;
  if(mode === 'qty'){
    qty = orderSheetState.qty;
    if(!qty || qty < 1){ msgEl.textContent = '数量を入力してください。'; return; }
  }
  if(mode === 'date'){
    desiredDate = orderSheetState.date;
    if(!desiredDate){ msgEl.textContent = '希望日を入力してください。'; return; }
  }

  const modeLabel = mode === 'circle' ? '○' : (mode === 'qty' ? '数量' : '日付');

  const { error: orderErr } = await sbClient.from('stock_orders').insert({
    stock_item_id: orderSheetState.stockItemId,
    operated_by_email: currentUser.email,
    operated_by_name: currentUser.name,
    destination: null,
    mode: modeLabel,
    qty: qty,
    desired_date: desiredDate,
    is_proxy: false,
    is_canceled: false
  });

  if(orderErr){
    msgEl.textContent = '発注に失敗しました：' + orderErr.message;
    return;
  }

  const { error: statusErr } = await sbClient
    .from('request_item_dates')
    .update({ status: '発注済み・受取待ち' })
    .eq('id', orderSheetState.dateRowId);

  if(statusErr){
    msgEl.textContent = '発注は完了しましたが、状態更新に失敗しました：' + statusErr.message;
    return;
  }

  await logChange('request_item_dates', orderSheetState.dateRowId, 'status', null, '発注済み・受取待ち', myItems.find(r => r.id === orderSheetState.dateRowId)?.category);

  document.getElementById('order-sheet-overlay').classList.remove('show');
  await loadMyItems();
}

// =============================================
// データ読み込み：自分のrequestsに紐づくrequest_items（カテゴリ・サイズ等）と、
// それぞれに紐づくrequest_item_dates（納入日ごとの状態・数量）を合成して
// 「納入日1件=1カード」のリストを作る
// =============================================
async function loadMyItems(){
  const { data: reqRows, error: reqErr } = await sbClient
    .from('requests')
    .select('id')
    .eq('requester_email', currentUser.email);

  if(reqErr){
    document.getElementById('load-error').style.display = 'block';
    document.getElementById('load-error').textContent = '依頼データの取得に失敗しました：' + reqErr.message;
    return;
  }

  const requestIds = (reqRows || []).map(r => r.id);
  if(!requestIds.length){
    myItems = [];
    renderList();
    return;
  }

  const { data: itemRows, error: itemErr } = await sbClient
    .from('request_items')
    .select('id, request_id, client_name, category, size_l, size_w, size_h, note_item')
    .in('request_id', requestIds);

  if(itemErr){
    document.getElementById('load-error').style.display = 'block';
    document.getElementById('load-error').textContent = '依頼明細の取得に失敗しました：' + itemErr.message;
    return;
  }

  const itemIds = (itemRows || []).map(r => r.id);
  if(!itemIds.length){
    myItems = [];
    renderList();
    return;
  }

  const { data: dateRows, error: dateErr } = await sbClient
    .from('request_item_dates')
    .select('id, request_item_id, delivery_date, qty, status, canceled_at, is_urgent')
    .in('request_item_id', itemIds)
    .order('delivery_date', { ascending: true });

  if(dateErr){
    document.getElementById('load-error').style.display = 'block';
    document.getElementById('load-error').textContent = '納入日データの取得に失敗しました：' + dateErr.message;
    return;
  }

  const itemById = {};
  (itemRows || []).forEach(it => { itemById[it.id] = it; });

  // 表示対象：ステータスが受付済み/作業中/発注可能/発注済み・受取待ちで未取消、または本日取消したもの
  // （発注済み・受取待ちは、配送済みになるまで一覧に残す。配送済みかどうかは後段で判定して除外する）
  myItems = (dateRows || [])
    .filter(d => {
      if(d.canceled_at) return isTodayJST(d.canceled_at);
      return ['受付済み','作業中','発注可能','発注済み・受取待ち'].includes(d.status);
    })
    .map(d => {
      const parent = itemById[d.request_item_id] || {};
      return {
        id: d.id,
        request_item_id: d.request_item_id,
        delivery_date: d.delivery_date,
        qty: d.qty,
        status: d.status,
        canceled_at: d.canceled_at,
        is_urgent: d.is_urgent,
        client_name: parent.client_name,
        category: parent.category,
        size_l: parent.size_l,
        size_w: parent.size_w,
        size_h: parent.size_h,
        note_item: parent.note_item
      };
    });

  // 発注済み・受取待ちのうち、配送済みになったものは一覧から除外する
  const orderedIds = myItems.filter(r => r.status === '発注済み・受取待ち').map(r => r.id);
  if(orderedIds.length){
    const deliveredDateIds = await getDeliveredDateIds(orderedIds);
    myItems = myItems.filter(r => !(r.status === '発注済み・受取待ち' && deliveredDateIds.has(r.id)));
  }

  document.getElementById('load-error').style.display = 'none';
  renderList();
}

// =============================================
// 発注済み・受取待ちの納入日IDのうち、配送済み（stock_deliveries.is_delivered=true）
// になっているものの request_item_date_id をSetで返す
// =============================================
async function getDeliveredDateIds(dateIds){
  const deliveredSet = new Set();

  const { data: stockRows } = await sbClient
    .from('stock_items')
    .select('id, request_item_date_id')
    .in('request_item_date_id', dateIds);

  if(!stockRows || !stockRows.length) return deliveredSet;

  const stockIdToDateId = {};
  const stockIds = stockRows.map(s => { stockIdToDateId[s.id] = s.request_item_date_id; return s.id; });

  const { data: orderRows } = await sbClient
    .from('stock_orders')
    .select('id, stock_item_id')
    .in('stock_item_id', stockIds)
    .eq('is_canceled', false);

  if(!orderRows || !orderRows.length) return deliveredSet;

  const orderIdToStockId = {};
  const orderIds = orderRows.map(o => { orderIdToStockId[o.id] = o.stock_item_id; return o.id; });

  const { data: deliveryRows } = await sbClient
    .from('stock_deliveries')
    .select('stock_order_id, is_delivered')
    .in('stock_order_id', orderIds)
    .eq('is_delivered', true);

  (deliveryRows || []).forEach(d => {
    const stockId = orderIdToStockId[d.stock_order_id];
    const dateId = stockIdToDateId[stockId];
    if(dateId) deliveredSet.add(dateId);
  });

  return deliveredSet;
}

async function initAuth(){
  const { data: { user } } = await sbClient.auth.getUser();

  if(!user){
    document.getElementById('auth-loading').style.display='none';
    document.getElementById('auth-login').style.display='block';
    return;
  }

  const { data: allowRow, error: allowErr } = await sbClient
    .from('users_allowlist')
    .select('name, role')
    .eq('email', user.email)
    .maybeSingle();

  if(allowErr || !allowRow || !allowRow.name){
    document.getElementById('auth-loading').style.display='none';
    document.getElementById('auth-denied').style.display='block';
    return;
  }

  currentUser.email = user.email;
  currentUser.name = allowRow.name;

  document.getElementById('login-name-display').textContent = currentUser.name;
  document.getElementById('auth-loading').style.display='none';
  document.getElementById('app-content').style.display='block';

  renderTabbar();
  await loadMyItems();
  subscribeRealtime();
}

// =============================================
// Realtime購読：request_item_dates（納入日ごとの状態）の変更を監視する
// =============================================
let realtimeReloadPending = false;

function isSheetOpen(){
  const overlay = document.getElementById('sheet-overlay');
  const orderOverlay = document.getElementById('order-sheet-overlay');
  return (overlay && overlay.classList.contains('show')) || (orderOverlay && orderOverlay.classList.contains('show'));
}

function requestMyItemsReload(){
  if(isSheetOpen()){
    realtimeReloadPending = true;
    return;
  }
  loadMyItems();
}

function subscribeRealtime(){
  sbClient
    .channel('mypage_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'request_item_dates' }, requestMyItemsReload)
    .subscribe((status, err) => {
      console.log('[realtime] channel status:', status, err || '');
    });

  setInterval(() => {
    if(realtimeReloadPending && !isSheetOpen()){
      realtimeReloadPending = false;
      loadMyItems();
    }
  }, 1500);
}

initAuth();
